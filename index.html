<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LAS CAPITULACIONES - Santa Fe 1491</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{background:#0a0a12;display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh;font-family:'Courier New',monospace;overflow:hidden;flex-direction:column}
#game-container{position:relative;width:100%;max-width:800px;aspect-ratio:16/9;background:#000;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid #222;border-radius:4px;box-shadow:0 0 40px rgba(100,50,200,0.3),inset 0 0 20px rgba(0,0,0,0.5)}
canvas{display:block;width:100%;height:100%}
.scanlines{position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.06),rgba(0,0,0,0.06) 1px,transparent 1px,transparent 3px);pointer-events:none;z-index:10}
#touchControls{display:none;position:fixed;bottom:0;left:0;width:100%;height:180px;z-index:100;pointer-events:none}
.touch-zone{pointer-events:auto;position:absolute;bottom:20px}
.dpad{left:15px;width:150px;height:150px}
.dpad-bg{width:150px;height:150px;position:relative}
.dpad-btn{position:absolute;background:rgba(255,255,255,0.07);border:2px solid rgba(255,255,255,0.18);border-radius:14px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.45);font-size:26px;transition:background 0.05s;-webkit-tap-highlight-color:transparent}
.dpad-btn:active,.dpad-btn.pressed{background:rgba(255,255,255,0.22);border-color:rgba(255,255,255,0.45)}
.dpad-up{top:0;left:46px;width:58px;height:58px}
.dpad-down{bottom:0;left:46px;width:58px;height:58px}
.dpad-left{top:46px;left:0;width:58px;height:58px}
.dpad-right{top:46px;right:0;width:58px;height:58px}
.action-btns{right:15px;display:flex;gap:14px;align-items:flex-end}
.action-btn{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,0.07);border:2px solid rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.45);font-size:13px;font-family:inherit;font-weight:bold;letter-spacing:1px;-webkit-tap-highlight-color:transparent}
.action-btn:active,.action-btn.pressed{background:rgba(255,255,255,0.22);border-color:rgba(255,255,255,0.45)}
.btn-jump{margin-bottom:40px}
.btn-fire{margin-bottom:0}
@media (max-width:900px),(pointer:coarse){#touchControls{display:block}}
@media (max-width:500px){.dpad{width:130px;height:130px}.dpad-bg{width:130px;height:130px}.dpad-btn{border-radius:10px}.dpad-up,.dpad-down{width:50px;height:50px;left:40px}.dpad-left,.dpad-right{width:50px;height:50px;top:40px}.action-btn{width:62px;height:62px;font-size:11px}}
</style>
</head>
<body>
<div id="game-container">
<canvas id="C" width="480" height="270"></canvas>
<div class="scanlines"></div>
</div>
<div id="touchControls">
<div class="touch-zone dpad">
<div class="dpad-bg">
<div class="dpad-btn dpad-up" data-key="up">▲</div>
<div class="dpad-btn dpad-down" data-key="down">▼</div>
<div class="dpad-btn dpad-left" data-key="left">◀</div>
<div class="dpad-btn dpad-right" data-key="right">▶</div>
</div>
</div>
<div class="touch-zone action-btns">
<div class="action-btn btn-jump" data-key="up">SALT</div>
<div class="action-btn btn-fire" data-key="fire">ATK</div>
</div>
</div>

<script>
// ============================================================
// LAS CAPITULACIONES - SANTA FE 1491
// Plataformas ambientado en la historia real de Santa Fe
// ============================================================
const C=document.getElementById('C'),$=C.getContext('2d');
$.imageSmoothingEnabled=false;
const W=480,H=270;

// --- AUDIO ---
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let audioCtx;
function initAudio(){if(!audioCtx)audioCtx=new AudioCtx()}
function snd(freq,dur,type='square',vol=0.06){
  if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
}
function sfxJump(){snd(350,0.12);setTimeout(()=>snd(500,0.08),40)}
function sfxHit(){snd(120,0.25,'sawtooth',0.08)}
function sfxShoot(){snd(700,0.07);setTimeout(()=>snd(550,0.05),25)}
function sfxPickup(){snd(600,0.08);setTimeout(()=>snd(800,0.08),70);setTimeout(()=>snd(1000,0.12),140)}
function sfxDeath(){snd(200,0.35,'sawtooth',0.1);setTimeout(()=>snd(100,0.4,'sawtooth',0.08),180)}
function sfxChest(){snd(400,0.08);setTimeout(()=>snd(600,0.08),90);setTimeout(()=>snd(800,0.12),180)}

// --- STORY ---
const STORY=[
  {title:'AÑO 1491',subtitle:'La Vega de Granada',text:'Los Reyes Católicos, Isabel y Fernando,\nhan establecido su campamento frente a Granada.\nEl último bastión nazarí resiste.',color:'#ffd700',bg:'#0a0818'},
  {title:'EL INCENDIO',subtitle:'El campamento arde',text:'Un incendio ha arrasado el campamento real.\nPero los Reyes ordenan levantar una nueva ciudad\nde piedra y mortero: SANTA FE.',color:'#ff6030',bg:'#180808'},
  {title:'TU MISIÓN',subtitle:'Caballero de la Reina',text:'Eres un caballero al servicio de Isabel.\nDebes atravesar la Vega, recuperar los pergaminos\nde las Capitulaciones y llegar a Santa Fe.',color:'#60ff60',bg:'#081808'},
  {title:'¡CUIDADO!',subtitle:'Peligros en el camino',text:'Soldados nazaríes, aves de rapiña\ny los temibles Djinn del desierto\nacechan en tu camino. ¡Buena suerte!',color:'#ff4040',bg:'#180808'},
];

const LORE=[
  {x:150,text:'Aquí acamparon 50.000 soldados\nen la Vega de Granada, 1491.'},
  {x:800,text:'La Reina Isabel empeñó sus joyas\npara financiar la campaña.'},
  {x:1500,text:'El campamento ardió una noche de verano.\nIsabel ordenó construir Santa Fe en piedra.'},
  {x:2300,text:'Boabdil, último rey nazarí,\nnegociaba en secreto la rendición.'},
  {x:3200,text:'Cristóbal Colón esperaba en Santa Fe\nla firma de las Capitulaciones.'},
  {x:4000,text:'El 2 de enero de 1492,\nGranada fue entregada a los Reyes Católicos.'},
];

// --- PALETTE ---
const PAL={
  armor:'#b0b8c8',armorLight:'#d0d8e8',armorDark:'#808898',
  gold:'#ffd700',goldDark:'#cc9900',
  skin:'#f0c090',skinDark:'#d0a070',
  pink:'#ff80b0',pinkDark:'#cc5080',
  grass:'#5a9a34',grassLight:'#7aba48',
  dirt:'#6a4a2a',dirtDark:'#4a3018',
  stone:'#6a6a7a',stoneDark:'#4a4a5a',stoneLight:'#8a8a9a',
};

// --- STATE ---
let state='menu',frame=0,shake=0,flashTimer=0;
let score=0,lives=3,armorOn=true;
let platforms,enemies,projectiles,particles,pickups,chests,decorations,signs;
let camX=0,storyPage=0,storyTimer=0,menuAnim=0;
const GRAV=0.32,JUMP=-7.2,SPEED=2.0,FIRE_RATE=20;
const LEVEL_W=4800,GROUND_Y=215;

const P={x:40,y:GROUND_Y-28,w:16,h:28,vx:0,vy:0,dir:1,onGround:false,
  attacking:false,attackTimer:0,invuln:0,fireCd:0,anim:0,dead:false,deathTimer:0};

// --- INPUT ---
const keys={};
document.addEventListener('keydown',e=>{
  initAudio();
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
  if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')keys.up=true;
  if(e.key==='ArrowDown'||e.key==='s')keys.down=true;
  if(e.key==='z'||e.key==='x'||e.key==='j'||e.key==='k')keys.fire=true;
  if(e.key==='Enter')keys.enter=true;
  e.preventDefault();
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
  if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')keys.up=false;
  if(e.key==='ArrowDown'||e.key==='s')keys.down=false;
  if(e.key==='z'||e.key==='x'||e.key==='j'||e.key==='k')keys.fire=false;
  if(e.key==='Enter')keys.enter=false;
});
document.querySelectorAll('[data-key]').forEach(btn=>{
  const k=btn.dataset.key;
  const on=()=>{initAudio();keys[k]=true;btn.classList.add('pressed')};
  const off=()=>{keys[k]=false;btn.classList.remove('pressed')};
  btn.addEventListener('touchstart',e=>{e.preventDefault();on()});
  btn.addEventListener('touchend',e=>{e.preventDefault();off()});
  btn.addEventListener('touchcancel',e=>{e.preventDefault();off()});
  btn.addEventListener('mousedown',on);btn.addEventListener('mouseup',off);btn.addEventListener('mouseleave',off);
});
C.addEventListener('click',()=>initAudio());

// --- SPRITES ---
const SC={};
function mkSpr(name,w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;fn(x);SC[name]=c;}

function buildSprites(){
  // CABALLERO CON ARMADURA
  const drawArmor=(x,l1,l2,a1,a2)=>{
    x.fillStyle='#707888';x.fillRect(3,0,10,3);
    x.fillStyle=PAL.armor;x.fillRect(2,2,12,6);
    x.fillStyle=PAL.armorLight;x.fillRect(4,2,8,2);
    x.fillStyle='#404858';x.fillRect(3,5,4,2);
    x.fillStyle='#40a0ff';x.fillRect(4,5,1,1);
    x.fillStyle='#cc1111';x.fillRect(7,0,3,3);x.fillRect(10,1,1,2);
    x.fillStyle=PAL.armor;x.fillRect(2,8,12,8);
    x.fillStyle=PAL.armorLight;x.fillRect(4,8,8,2);
    x.fillStyle='#cc1111';x.fillRect(6,10,4,4);x.fillRect(5,11,6,2);
    x.fillStyle=PAL.armorDark;x.fillRect(0,9+a1,3,6);x.fillRect(13,9+a2,3,6);
    x.fillStyle=PAL.armor;x.fillRect(0,9+a1,3,4);x.fillRect(13,9+a2,3,4);
    x.fillStyle=PAL.armorDark;x.fillRect(3,16,4,7+l1);x.fillRect(9,16,4,7+l2);
    x.fillStyle=PAL.armor;x.fillRect(3,16,4,5);x.fillRect(9,16,4,5);
    x.fillStyle='#604020';x.fillRect(2,23+l1,5,5-l1);x.fillRect(9,23+l2,5,5-l2);
    x.fillStyle='#805030';x.fillRect(2,23+l1,5,2);x.fillRect(9,23+l2,5,2);
  };
  mkSpr('ka0',16,28,x=>drawArmor(x,0,0,0,0));
  mkSpr('ka1',16,28,x=>drawArmor(x,2,-1,-1,2));
  mkSpr('ka2',16,28,x=>drawArmor(x,-1,2,2,-1));
  mkSpr('ka_j',16,28,x=>drawArmor(x,-3,-3,-2,-2));
  mkSpr('ka_a',20,28,x=>{
    x.fillStyle='#707888';x.fillRect(3,0,10,3);
    x.fillStyle=PAL.armor;x.fillRect(2,2,12,6);x.fillStyle=PAL.armorLight;x.fillRect(4,2,8,2);
    x.fillStyle='#404858';x.fillRect(3,5,4,2);x.fillStyle='#40a0ff';x.fillRect(4,5,1,1);
    x.fillStyle='#cc1111';x.fillRect(7,0,3,3);
    x.fillStyle=PAL.armor;x.fillRect(2,8,12,8);
    x.fillStyle='#cc1111';x.fillRect(6,10,4,4);x.fillRect(5,11,6,2);
    x.fillStyle=PAL.armorDark;x.fillRect(0,10,3,6);
    x.fillStyle=PAL.armor;x.fillRect(13,10,4,3);
    x.fillStyle='#8B4513';x.fillRect(17,10,3,2);
    x.fillStyle=PAL.armorDark;x.fillRect(3,16,4,8);x.fillRect(9,16,4,8);
    x.fillStyle=PAL.armor;x.fillRect(3,16,4,5);x.fillRect(9,16,4,5);
    x.fillStyle='#604020';x.fillRect(2,24,5,4);x.fillRect(9,24,5,4);
  });

  // SIN ARMADURA
  const drawBoxer=(x,l1,l2)=>{
    x.fillStyle=PAL.skin;x.fillRect(3,0,10,8);
    x.fillStyle='#604020';x.fillRect(3,0,10,3);
    x.fillStyle='#fff';x.fillRect(4,3,3,3);x.fillRect(9,3,3,3);
    x.fillStyle='#000';x.fillRect(5,4,2,2);x.fillRect(10,4,2,2);

  // SOLDADO NAZARÍ

  // DJINN
  mkSpr('dj0',24,24,x=>{

  mkSpr('boss',48,48,x=>{

function mkE(x,y,type){
  const e={x,y,type,vx:0,vy:0,hp:1,dead:false,anim:0,w:16,h:24,dir:-1,
    shootTimer:0,emerging:false,emergeY:0,spawnX:x,spawnY:y,active:false,
    patrolRange:200,retreatTimer:0};
  switch(type){
    case 'nazari':e.h=24;e.hp=1;e.vx=0.5;e.emerging=true;e.emergeY=y;e.y=y+18;break;
    case 'djinn':e.w=24;e.h=24;e.hp=3;e.patrolRange=180;break;
    case 'rapaz':e.w=18;e.h=12;e.hp=1;e.vx=-2;break;
    case 'ballestero':e.h=22;e.hp=2;break;
    case 'boss':e.w=48;e.h=48;e.hp=20;e.vx=1.2;break;
  }
  return e;
}

function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

// --- UPDATE ---
function update(){
  if(state==='story'){
    storyTimer++;
    if((keys.enter||keys.fire)&&storyTimer>20){storyPage++;storyTimer=0;keys.enter=false;keys.fire=false;
      if(storyPage>=STORY.length){state='playing';startGame_();}}
    return;
  }
  if(state!=='playing')return;
  frame++;

  if(!P.dead){
    P.vx=0;
    if(keys.left){P.vx=-SPEED;P.dir=-1;}
    if(keys.right){P.vx=SPEED;P.dir=1;}
    if(keys.up&&P.onGround){P.vy=JUMP;P.onGround=false;sfxJump();}
    P.vy+=GRAV;if(P.vy>8)P.vy=8;
    P.x+=P.vx;
    for(const p of platforms)if(overlap(P,p)){if(P.vx>0)P.x=p.x-P.w;if(P.vx<0)P.x=p.x+p.w;}
    P.y+=P.vy;P.onGround=false;
    for(const p of platforms)if(overlap(P,p)){if(P.vy>0){P.y=p.y-P.h;P.vy=0;P.onGround=true;}else if(P.vy<0){P.y=p.y+p.h;P.vy=0;}}
    if(P.y>H+60)pDeath();
    if(P.x<0)P.x=0;if(P.x>LEVEL_W-P.w)P.x=LEVEL_W-P.w;
    if(keys.fire&&P.fireCd<=0){P.attacking=true;P.attackTimer=12;P.fireCd=FIRE_RATE;sfxShoot();
      projectiles.push({x:P.x+(P.dir>0?P.w:-16),y:P.y+10,vx:P.dir*4.5,vy:0,w:16,h:6,player:true,life:80});}
    if(P.fireCd>0)P.fireCd--;
    if(P.attackTimer>0)P.attackTimer--;else P.attacking=false;
    if(P.invuln>0)P.invuln--;
    if(Math.abs(P.vx)>0.1)P.anim+=0.18;else P.anim=0;

    for(const c of chests)if(!c.open&&overlap(P,c)){c.open=true;sfxChest();spawnPk(c.x,c.y-18,c.item);}
    for(let i=pickups.length-1;i>=0;i--){const pk=pickups[i];if(overlap(P,pk)){sfxPickup();
      if(pk.type==='heart')lives=Math.min(lives+1,5);
      else if(pk.type==='armor')armorOn=true;
      else if(pk.type==='coin')score+=500;
      else if(pk.type==='scroll')score+=1000;
      spawnParts(pk.x+6,pk.y+6,8,'#ffd700');pickups.splice(i,1);}}

    for(const s of signs){if(Math.abs(P.x-s.x)<60&&!s.shown){s.shown=true;s.timer=280;}if(s.timer>0)s.timer--;}
  } else {
    P.deathTimer--;if(P.deathTimer<=0){if(lives<=0)state='gameover';else respawn();}
  }

  // Proyectiles
  for(let i=projectiles.length-1;i>=0;i--){
    const pr=projectiles[i];pr.x+=pr.vx;pr.y+=pr.vy;pr.life--;
    if(pr.life<=0||pr.y>H+20){projectiles.splice(i,1);continue;}
    if(pr.player){for(const e of enemies){if(!e.dead&&e.active&&overlap(pr,e)){
      e.hp--;spawnParts(pr.x,pr.y,5,'#ff0');
      if(e.hp<=0){e.dead=true;score+=e.type==='boss'?5000:e.type==='djinn'?500:100;
        spawnParts(e.x+e.w/2,e.y+e.h/2,15,'#ff4040');
        if(e.type==='boss'){state='victory';shake=20;}}
      projectiles.splice(i,1);break;}}}
    else{if(!P.dead&&P.invuln<=0&&overlap(pr,P)){pHit();projectiles.splice(i,1);}}
  }

  // Enemigos
  for(const e of enemies){
    if(e.dead)continue;
    if(!e.active&&Math.abs(e.spawnX-P.x)<320)e.active=true;
    if(!e.active)continue;
    e.anim++;

    switch(e.type){
      case 'nazari':
        if(e.emerging){e.y-=0.4;if(e.y<=e.emergeY){e.y=e.emergeY;e.emerging=false;}}
        else{e.dir=P.x<e.x?-1:1;e.x+=e.vx*e.dir;e.vy+=GRAV;e.y+=e.vy;
          for(const p of platforms)if(overlap(e,p)&&e.vy>0){e.y=p.y-e.h;e.vy=0;}
          if(e.y>H+50)e.dead=true;}
        break;

      case 'djinn':{
        const dx=P.x-e.x,dy=P.y-e.y,d=Math.sqrt(dx*dx+dy*dy)||1;
        const distFS=Math.abs(e.x-e.spawnX);
        if(distFS>e.patrolRange)e.retreatTimer=80;
        if(e.retreatTimer>0){e.retreatTimer--;
          const tx=e.spawnX-e.x,ty=e.spawnY-e.y,td=Math.sqrt(tx*tx+ty*ty)||1;
          e.x+=(tx/td)*1.5;e.y+=(ty/td)*1.5;
        } else if(d<220){
          const ang=Math.atan2(dy,dx),wave=Math.sin(e.anim*0.04)*1.5;
          if(e.anim%140<100){
            e.x+=Math.cos(ang)*0.7+Math.cos(e.anim*0.05)*wave;
            e.y+=Math.sin(ang)*0.5+Math.sin(e.anim*0.05)*wave;
          } else { e.x+=Math.sin(e.anim*0.1)*0.3;e.y+=Math.cos(e.anim*0.1)*0.3; }
        } else {e.x=e.spawnX+Math.sin(e.anim*0.02)*35;e.y=e.spawnY+Math.cos(e.anim*0.03)*15;}
        e.dir=dx<0?-1:1;if(e.y<25)e.y=25;if(e.y>GROUND_Y-e.h)e.y=GROUND_Y-e.h;
        break;}

      case 'rapaz':e.x+=e.vx;e.y+=Math.sin(e.anim*0.07)*1.2;if(e.x<camX-40)e.x=camX+W+20;break;

      case 'ballestero':
        e.dir=P.x<e.x?-1:1;e.shootTimer++;
        if(e.shootTimer>200){e.shootTimer=0;const dx=P.x-e.x,dy=P.y-e.y,d=Math.sqrt(dx*dx+dy*dy)||1;
          if(d<280)projectiles.push({x:e.x+8,y:e.y+4,vx:(dx/d)*2.2,vy:(dy/d)*2.2,w:5,h:3,player:false,life:100});}
        break;

      case 'boss':
        e.x+=e.vx;if(e.x>4600||e.x<4100)e.vx*=-1;
        e.dir=P.x<e.x?-1:1;
        if(e.anim%150===0)e.vy=-7;
        e.vy+=GRAV;e.y+=e.vy;
        for(const p of platforms)if(overlap(e,p)&&e.vy>0){e.y=p.y-e.h;e.vy=0;}
        if(e.anim%100===0){const dx=P.x-e.x,dy=P.y-e.y,d=Math.sqrt(dx*dx+dy*dy)||1;
          projectiles.push({x:e.x+24,y:e.y+24,vx:(dx/d)*2.2,vy:(dy/d)*2.2,w:7,h:7,player:false,life:120});}
        break;
    }
    if(!P.dead&&P.invuln<=0&&!e.dead&&overlap(e,P))pHit();
  }

  for(const pk of pickups){pk.ft=(pk.ft||0)+0.05;pk.dy=pk.y+Math.sin(pk.ft)*3;pk.life--;if(pk.life<=0)pickups.splice(pickups.indexOf(pk),1);}
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.life--;if(p.life<=0)particles.splice(i,1);}

  const ct=P.x-W/3;camX+=(ct-camX)*0.08;if(camX<0)camX=0;if(camX>LEVEL_W-W)camX=LEVEL_W-W;
  if(shake>0){shake*=0.9;if(shake<0.5)shake=0;}
  if(flashTimer>0)flashTimer--;
}

function pHit(){if(P.invuln>0||P.dead)return;sfxHit();shake=6;flashTimer=5;
  if(armorOn){armorOn=false;P.invuln=100;spawnParts(P.x+8,P.y+14,12,PAL.armor);}else pDeath();}
function pDeath(){P.dead=true;P.deathTimer=80;lives--;sfxDeath();shake=10;spawnParts(P.x+8,P.y+14,20,'#ff3030');}
function respawn(){P.dead=false;P.x=Math.max(0,P.x-200);P.y=100;P.vx=0;P.vy=0;P.invuln=120;armorOn=true;}
function spawnPk(x,y,type){pickups.push({x,y,dy:y,w:type==='coin'?10:12,h:type==='scroll'?14:12,type,life:600,ft:0});}
function spawnParts(x,y,n,col){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5-2,life:18+Math.random()*18,color:col,size:1+Math.random()*2});}

// --- DRAW ---
function draw(){
  $.fillStyle='#000';$.fillRect(0,0,W,H);
  if(state==='menu'){drawMenu();return;}
  if(state==='story'){drawStory();return;}
  if(state==='gameover'){drawGO();return;}
  if(state==='victory'){drawWin();return;}

  const sx=shake?(Math.random()-0.5)*shake:0,sy=shake?(Math.random()-0.5)*shake:0;
  $.save();$.translate(sx,sy);
  drawBg();$.save();$.translate(-Math.floor(camX),0);
  drawPlats();drawDeco();drawChests();drawPks();drawProjs();drawEns();if(!P.dead)drawP();drawParts();drawCastle();
  $.restore();
  if(flashTimer>0){$.fillStyle=`rgba(255,255,255,${flashTimer/8})`;$.fillRect(0,0,W,H);}
  drawHUD();drawLore();$.restore();
}

function drawBg(){
  const g=$.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#030610');g.addColorStop(0.3,'#0a1530');g.addColorStop(0.6,'#15254a');g.addColorStop(1,'#1a3060');
  $.fillStyle=g;$.fillRect(0,0,W,H);
  for(let i=0;i<50;i++){const sx=((i*137+42)%W+camX*0.015)%W,sy=((i*97+126)%140);
    const b=0.3+((i*73)%100)/100*0.7,tw=Math.sin(frame*0.025+i)*0.3+0.7;
    $.fillStyle=`rgba(255,255,255,${b*tw})`;$.fillRect(sx,sy,(i%3===0)?2:1,(i%3===0)?2:1);}
  const mx=W*0.82-camX*0.008,my=35;
  const mg=$.createRadialGradient(mx,my,8,mx,my,45);
  mg.addColorStop(0,'rgba(254,243,199,0.18)');mg.addColorStop(1,'rgba(254,243,199,0)');
  $.fillStyle=mg;$.beginPath();$.arc(mx,my,45,0,Math.PI*2);$.fill();
  $.fillStyle='#fef3c7';$.beginPath();$.arc(mx,my,14,0,Math.PI*2);$.fill();
  $.fillStyle='#f0dfa0';$.beginPath();$.arc(mx-2,my-1,12,0,Math.PI*2);$.fill();

  $.fillStyle='#080e22';for(let i=0;i<14;i++){const bx=i*110-(camX*0.04)%110,bh=35+((i*71)%35);drawMtn(bx,H-55,110,bh);}
  $.fillStyle='#0c1630';for(let i=0;i<11;i++){const bx=i*140-(camX*0.08)%140,bh=25+((i*53)%22);drawMtn(bx,H-45,140,bh);}
  $.fillStyle='#101e38';for(let i=0;i<9;i++){const bx=i*170-(camX*0.15)%170,bh=20+((i*37)%18);drawMtn(bx,H-35,170,bh);}
  $.fillStyle='rgba(20,40,80,0.12)';$.fillRect(0,H-70,W,25);
}
function drawMtn(x,by,w,h){$.beginPath();$.moveTo(x,by);$.lineTo(x+w*0.3,by-h*0.7);$.lineTo(x+w*0.45,by-h);$.lineTo(x+w*0.65,by-h*0.65);$.lineTo(x+w,by);$.fill();}

function drawPlats(){
  for(const p of platforms){
    if(p.x+p.w<camX-20||p.x>camX+W+20)continue;
    if(p.type==='ground'){
      $.fillStyle=PAL.dirt;$.fillRect(p.x,p.y,p.w,p.h);
      $.fillStyle=PAL.dirtDark;$.fillRect(p.x,p.y+8,p.w,p.h-8);
      $.fillStyle=PAL.grass;$.fillRect(p.x,p.y,p.w,5);
      $.fillStyle=PAL.grassLight;$.fillRect(p.x,p.y,p.w,2);
      for(let gx=p.x;gx<p.x+p.w;gx+=7){const gh=2+((gx*7)%3);$.fillStyle=PAL.grassLight;$.fillRect(gx,p.y-gh,2,gh);}
      $.fillStyle='rgba(0,0,0,0.08)';
      for(let dx=p.x;dx<p.x+p.w;dx+=11)for(let dy=p.y+7;dy<p.y+p.h;dy+=9)$.fillRect(dx+((dy*3)%7),dy,2,2);
    } else if(p.type==='float'){
      $.fillStyle=PAL.stone;$.fillRect(p.x,p.y,p.w,p.h);
      $.fillStyle=PAL.stoneLight;$.fillRect(p.x,p.y,p.w,3);
      $.fillStyle=PAL.stoneDark;$.fillRect(p.x,p.y+p.h-3,p.w,3);
      $.fillStyle='rgba(60,140,40,0.3)';$.fillRect(p.x+2,p.y,3,2);$.fillRect(p.x+p.w-6,p.y,4,2);
    } else if(p.type==='bridge'){
      $.fillStyle='#6a4a2a';$.fillRect(p.x,p.y,p.w,p.h);
      $.fillStyle='#8a6a3a';$.fillRect(p.x,p.y,p.w,3);
    }
  }
}

function drawDeco(){for(const d of decorations){if(d.x<camX-40||d.x>camX+W+40)continue;if(SC[d.type])$.drawImage(SC[d.type],d.x,d.y);}}
function drawChests(){for(const c of chests){if(c.x<camX-20||c.x>camX+W+20)continue;$.drawImage(SC[c.open?'ch1':'ch0'],c.x,c.y);}}
function drawPks(){for(const pk of pickups){if(pk.x<camX-20||pk.x>camX+W+20)continue;const dy=pk.dy||pk.y;
  const s=pk.type==='heart'?'heart':pk.type==='armor'?'armor_pk':pk.type==='scroll'?'scroll':'coin';
  $.fillStyle='rgba(255,215,0,0.12)';$.beginPath();$.arc(pk.x+6,dy+6,10,0,Math.PI*2);$.fill();$.drawImage(SC[s],pk.x,dy);}}

function drawProjs(){for(const pr of projectiles){
  if(pr.player){$.save();$.translate(pr.x,pr.y);if(pr.vx<0){$.scale(-1,1);$.translate(-16,0);}$.drawImage(SC['lance'],0,0);$.restore();}
  else{$.fillStyle='#ff4020';$.beginPath();$.arc(pr.x+3,pr.y+3,3.5,0,Math.PI*2);$.fill();
    $.fillStyle='#ffaa00';$.beginPath();$.arc(pr.x+3,pr.y+3,1.5,0,Math.PI*2);$.fill();}}}

function drawEns(){for(const e of enemies){if(e.dead||!e.active||e.x+e.w<camX-30||e.x>camX+W+30)continue;
  $.save();const fl=e.dir<0;
  switch(e.type){
    case 'nazari':{const fr=Math.floor(e.anim/12)%2;if(fl){$.translate(e.x+e.w,e.y);$.scale(-1,1);}else $.translate(e.x,e.y);$.drawImage(SC['nz'+fr],0,0);break;}
    case 'djinn':{const fr=Math.floor(e.anim/10)%2;$.fillStyle='rgba(30,100,180,0.08)';$.beginPath();$.arc(e.x+12,e.y+12,20,0,Math.PI*2);$.fill();
      if(fl){$.translate(e.x+e.w,e.y);$.scale(-1,1);}else $.translate(e.x,e.y);$.drawImage(SC['dj'+fr],0,0);break;}
    case 'rapaz':{const fr=Math.floor(e.anim/6)%2;$.translate(e.x,e.y);$.drawImage(SC['av'+fr],0,0);break;}
    case 'ballestero':{const fr=e.shootTimer>180?1:0;if(fl){$.translate(e.x+e.w,e.y);$.scale(-1,1);}else $.translate(e.x,e.y);$.drawImage(SC['bl'+fr],0,0);break;}
    case 'boss':{if(fl){$.translate(e.x+e.w,e.y);$.scale(-1,1);}else $.translate(e.x,e.y);$.drawImage(SC['boss'],0,0);$.restore();$.save();
      const bx=e.x,by=e.y-14;$.fillStyle='rgba(0,0,0,0.7)';$.fillRect(bx-2,by-1,54,8);
      $.fillStyle='#300';$.fillRect(bx,by,50,6);$.fillStyle='#c02020';$.fillRect(bx,by,50*(e.hp/20),6);
      $.fillStyle='#ff4040';$.fillRect(bx,by,50*(e.hp/20),3);
      $.font='bold 6px Courier New';$.fillStyle='#fff';$.textAlign='center';$.fillText('BOABDIL',bx+25,by-3);$.textAlign='left';break;}
  }$.restore();}}

function drawP(){$.save();if(P.invuln>0&&Math.floor(P.invuln/3)%2)$.globalAlpha=0.4;
  const pre=armorOn?'ka':'kb';let spr;
  if(P.attacking&&armorOn)spr='ka_a';else if(!P.onGround&&armorOn)spr='ka_j';
  else{const fr=Math.floor(P.anim)%3;spr=pre+fr;}
  const s=SC[spr];if(!s){$.restore();return;}
  if(P.dir<0){$.translate(P.x+P.w,P.y);$.scale(-1,1);$.drawImage(s,0,0);}else $.drawImage(s,P.x,P.y);$.restore();}

function drawParts(){for(const p of particles){$.fillStyle=p.color;$.globalAlpha=Math.min(1,p.life/10);$.fillRect(p.x,p.y,p.size,p.size);}$.globalAlpha=1;}

function drawCastle(){
  const cx=LEVEL_W-280;
  $.fillStyle='#c0a060';$.fillRect(cx,GROUND_Y-90,220,90);$.fillStyle='#d4b880';$.fillRect(cx+4,GROUND_Y-86,212,82);
  for(let t=0;t<3;t++){const tx=cx+t*90;
    $.fillStyle='#b09050';$.fillRect(tx,GROUND_Y-120,40,120);$.fillStyle='#c0a060';$.fillRect(tx+3,GROUND_Y-115,34,110);
    for(let b=0;b<4;b++){$.fillStyle='#b09050';$.fillRect(tx+b*10,GROUND_Y-128,8,10);}
    $.fillStyle='#ffa040';$.fillRect(tx+13,GROUND_Y-100,14,18);$.fillStyle='#ff8020';$.fillRect(tx+15,GROUND_Y-98,10,14);
    $.fillStyle='#b09050';$.fillRect(tx+19,GROUND_Y-100,2,18);}
  $.fillStyle='#604020';$.fillRect(cx+75,GROUND_Y-55,70,55);$.fillStyle='#402a10';$.fillRect(cx+80,GROUND_Y-50,60,50);
  $.fillStyle='#c0a060';$.beginPath();$.arc(cx+110,GROUND_Y-55,35,Math.PI,0);$.fill();
  $.fillStyle='#d4b880';$.beginPath();$.arc(cx+110,GROUND_Y-55,30,Math.PI,0);$.fill();
  $.fillStyle=PAL.gold;$.fillRect(cx+100,GROUND_Y-95,20,20);$.fillStyle='#cc1111';$.fillRect(cx+102,GROUND_Y-93,16,16);
  $.fillStyle=PAL.gold;$.fillRect(cx+107,GROUND_Y-91,6,12);$.fillRect(cx+104,GROUND_Y-87,12,4);
  const fw=Math.sin(frame*0.07)*3;
  for(let t=0;t<3;t++){const tx=cx+t*90+18;$.fillStyle='#604020';$.fillRect(tx,GROUND_Y-138,2,16);
    $.fillStyle='#cc1111';$.fillRect(tx+2,GROUND_Y-138+fw,10,6);
    $.fillStyle=PAL.gold;$.fillRect(tx+4,GROUND_Y-136+fw,1,4);$.fillRect(tx+3,GROUND_Y-135+fw,3,1);}
  $.font='bold 8px Courier New';$.fillStyle=PAL.gold;$.textAlign='center';$.fillText('SANTA FE',cx+110,GROUND_Y-62);$.textAlign='left';
}

function drawHUD(){
  $.fillStyle='rgba(0,0,0,0.5)';$.fillRect(0,0,W,22);
  $.fillStyle='#ff3060';$.font='bold 10px Courier New';$.fillText('♥',6,14);
  $.fillStyle='#fff';$.fillText('×'+lives,16,14);
  if(armorOn){$.fillStyle=PAL.armor;$.fillRect(48,5,10,12);$.fillStyle='#cc1111';$.fillRect(50,8,6,4);}
  else{$.fillStyle=PAL.pink;$.fillRect(48,5,10,12);$.fillStyle='#fff';$.fillRect(51,7,4,1);}
  $.fillStyle=PAL.gold;$.textAlign='right';$.fillText('SCORE '+String(score).padStart(7,'0'),W-8,14);$.textAlign='left';
  $.fillStyle='#aaa';$.fillText('LANZA',78,14);
  const boss=enemies&&enemies.find(e=>e.type==='boss'&&!e.dead&&e.active);
  if(boss){$.fillStyle='rgba(0,0,0,0.6)';$.fillRect(W/2-65,1,130,19);
    $.fillStyle='#ddd';$.font='bold 7px Courier New';$.textAlign='center';
    $.fillText('⚔ BOABDIL · REY DE GRANADA ⚔',W/2,10);
    $.fillStyle='#300';$.fillRect(W/2-50,13,100,5);$.fillStyle='#c02020';$.fillRect(W/2-50,13,100*(boss.hp/20),5);
    $.fillStyle='#ff4040';$.fillRect(W/2-50,13,100*(boss.hp/20),2);$.textAlign='left';}
}

function drawLore(){for(const s of signs){if(s.timer>0){
  const a=Math.min(1,s.timer/30,Math.min(1,(280-s.timer+30)/30));
  $.save();$.globalAlpha=a;const bw=230,bh=42,bx=(W-bw)/2,by=H-58;
  $.fillStyle='rgba(30,20,10,0.88)';$.fillRect(bx,by,bw,bh);
  $.strokeStyle='rgba(200,160,80,0.4)';$.lineWidth=1;$.strokeRect(bx,by,bw,bh);
  $.fillStyle='#d4b880';$.font='8px Courier New';$.textAlign='center';
  const lines=s.text.split('\n');for(let i=0;i<lines.length;i++)$.fillText(lines[i],W/2,by+12+i*12);
  $.textAlign='left';$.restore();}}}

// --- SCREENS ---
function drawMenu(){
  menuAnim++;
  const g=$.createLinearGradient(0,0,0,H);g.addColorStop(0,'#030508');g.addColorStop(0.4,'#0a1020');g.addColorStop(1,'#15203a');
  $.fillStyle=g;$.fillRect(0,0,W,H);
  for(let i=0;i<25;i++){const px=(i*47+menuAnim*0.25)%W,py=(i*31+menuAnim*0.4)%H;
    $.fillStyle=`rgba(255,200,100,${0.05+((i*7)%10)/40})`;$.fillRect(px,py,2,2);}
  $.fillStyle='rgba(255,200,100,0.03)';$.fillRect(W/2-120,H-80,240,50);
  for(let i=0;i<5;i++)$.fillRect(W/2-100+i*45,H-95,20,30);

  $.save();$.textAlign='center';
  $.font='bold 10px Courier New';$.fillStyle='rgba(255,215,0,0.35)';$.fillText('GHOSTS \'N GOBLINS PRESENTA',W/2,30);
  $.font='bold 28px Courier New';$.fillStyle='#8a5500';$.fillText('LAS',W/2+2,62);$.fillStyle=PAL.gold;$.fillText('LAS',W/2,60);
  $.fillStyle='#5a1111';$.fillText('CAPITULACIONES',W/2+2,92);$.fillStyle='#ff4040';$.fillText('CAPITULACIONES',W/2,90);
  $.font='bold 12px Courier New';$.fillStyle='#c0a060';$.fillText('★ SANTA FE · GRANADA · 1491 ★',W/2,112);
  $.font='9px Courier New';$.fillStyle='#7a7a9a';
  $.fillText('Recupera los pergaminos de la paz',W/2,130);$.fillText('y llega a las puertas de Santa Fe',W/2,142);
  const btnY=165,hov=Math.sin(menuAnim*0.06)*2;
  $.fillStyle='rgba(255,255,255,0.06)';$.fillRect(W/2-75,btnY+hov-2,150,26);
  $.strokeStyle='rgba(255,255,255,0.3)';$.lineWidth=1;$.strokeRect(W/2-75,btnY+hov-2,150,26);
  $.fillStyle='#fff';$.font='bold 14px Courier New';$.fillText('▶ COMENZAR',W/2,btnY+hov+15);
  if(Math.floor(menuAnim/30)%2){$.fillStyle=PAL.gold;$.font='9px Courier New';$.fillText('PULSA ENTER O TOCA PARA EMPEZAR',W/2,210);}
  $.font='7px Courier New';$.fillStyle='#444';
  $.fillText('← → MOVERSE  |  ↑/ESPACIO SALTO  |  Z/X ATACAR',W/2,240);
  $.fillText('Basado en Ghosts \'n Goblins (Capcom, 1985) · Ambientado en hechos reales',W/2,252);
  $.restore();
  if(keys.enter||keys.fire||keys.up){initAudio();state='story';storyPage=0;storyTimer=0;keys.enter=false;keys.fire=false;keys.up=false;}
}

function drawStory(){
  storyTimer++;const pg=STORY[storyPage];if(!pg){state='playing';return;}
  $.fillStyle=pg.bg;$.fillRect(0,0,W,H);
  $.strokeStyle='rgba(200,160,80,0.15)';$.lineWidth=2;$.strokeRect(20,15,W-40,H-30);
  $.save();$.textAlign='center';$.globalAlpha=Math.min(1,storyTimer/40);
  $.font='bold 22px Courier New';$.fillStyle=pg.color;$.fillText(pg.title,W/2,65);
  if(pg.subtitle){$.font='bold 12px Courier New';$.fillStyle='#8888aa';$.fillText(pg.subtitle,W/2,85);}
  $.font='10px Courier New';$.fillStyle='#c0c0d0';const lines=pg.text.split('\n');
  for(let i=0;i<lines.length;i++)$.fillText(lines[i],W/2,115+i*18);
  if(storyTimer>20&&Math.floor(storyTimer/20)%2){$.font='8px Courier New';$.fillStyle='#888';$.fillText('PULSA ENTER PARA CONTINUAR →',W/2,H-25);}
  $.fillStyle='#555';for(let i=0;i<STORY.length;i++){$.fillStyle=i===storyPage?pg.color:'#333';$.fillRect(W/2-20+i*12,H-12,8,4);}
  $.restore();
}

function drawGO(){
  $.fillStyle='rgba(0,0,0,0.88)';$.fillRect(0,0,W,H);$.save();$.textAlign='center';
  const gs=Math.sin(frame*0.1)*2;$.font='bold 32px Courier New';$.fillStyle='#500';$.fillText('GAME OVER',W/2+2,H/2+gs+2);
  $.fillStyle='#ff2020';$.fillText('GAME OVER',W/2,H/2+gs);
  $.font='bold 11px Courier New';$.fillStyle=PAL.gold;$.fillText('SCORE: '+String(score).padStart(7,'0'),W/2,H/2+28);
  $.font='9px Courier New';$.fillStyle='#aaa';$.fillText('Granada sigue sin conquistar...',W/2,H/2+46);
  if(Math.floor(frame/25)%2){$.fillStyle='#777';$.fillText('PULSA ENTER PARA REINTENTAR',W/2,H/2+68);}
  $.restore();if(keys.enter||keys.fire){state='menu';keys.enter=false;keys.fire=false;}
}

function drawWin(){
  $.fillStyle='rgba(0,0,0,0.82)';$.fillRect(0,0,W,H);$.save();$.textAlign='center';
  for(let i=0;i<10;i++){const a=frame*0.02+i*0.63,r=40+Math.sin(frame*0.03+i)*20;
    $.fillStyle=`rgba(255,215,0,${0.15+Math.sin(frame*0.05+i)*0.1})`;
    $.beginPath();$.arc(W/2+Math.cos(a)*r,H/2-20+Math.sin(a)*r*0.5,3,0,Math.PI*2);$.fill();}
  $.font='bold 26px Courier New';$.fillStyle='#8a6600';$.fillText('¡VICTORIA!',W/2+2,H/2-28);
  $.fillStyle=PAL.gold;$.fillText('¡VICTORIA!',W/2,H/2-30);
  $.font='11px Courier New';$.fillStyle='#d0d0e0';
  $.fillText('Has llegado a las puertas de Santa Fe.',W/2,H/2);
  $.fillText('Las Capitulaciones están a salvo.',W/2,H/2+16);
  $.font='9px Courier New';$.fillStyle='#a0a0b0';
  $.fillText('El 2 de enero de 1492, Granada se rindió.',W/2,H/2+36);
  $.fillText('Colón firmó aquí el viaje que cambiaría el mundo.',W/2,H/2+50);
  $.font='bold 11px Courier New';$.fillStyle=PAL.gold;$.fillText('SCORE: '+String(score).padStart(7,'0'),W/2,H/2+72);
  if(Math.floor(frame/25)%2){$.font='9px Courier New';$.fillStyle='#777';$.fillText('PULSA ENTER PARA JUGAR DE NUEVO',W/2,H/2+92);}
  $.restore();if(keys.enter||keys.fire){state='menu';keys.enter=false;keys.fire=false;}
}

function startGame_(){
  score=0;lives=3;armorOn=true;
  P.x=40;P.y=GROUND_Y-40;P.vx=0;P.vy=0;P.dir=1;P.onGround=false;P.dead=false;
  P.invuln=60;P.fireCd=0;P.anim=0;P.attacking=false;P.attackTimer=0;P.deathTimer=0;
  camX=0;shake=0;flashTimer=0;frame=0;genLevel();
}

buildSprites();
(function loop(){update();draw();requestAnimationFrame(loop)})();
</script>

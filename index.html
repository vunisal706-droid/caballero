<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  touch-action:none;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

body.mobile-portrait::before {
  content: "Por favor, gira tu dispositivo a horizontal ↻";
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #1a1a2e;
  color: #ffd700;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  font-size: 24px;
  text-align: center;
  z-index: 9999;
  padding: 20px;
}
body.mobile-portrait #game-container,
body.mobile-portrait #touchControls {
  display: none !important;
}

html, body {
  position: fixed;
  overflow: hidden;
  width: 100%;
  height: 100%;
}

body{
  background:#0a0a12;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  min-height:100dvh;
  font-family:Arial, sans-serif;
  overflow:hidden;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}

#game-container{
  position: relative;
  width: 100%;
  max-width: 100vw;
  max-height: 100vh;
  aspect-ratio: 16/9;
  background: #000;
  border: 3px solid #222;
  border-radius: 4px;
  box-shadow: 0 0 40px rgba(100,50,200,0.3), inset 0 0 20px rgba(0,0,0,0.5);
}

@media screen and (max-width: 900px) {
  #game-container {
    width: 100vw;
    height: 56.25vw;
    max-height: 60vh;
  }
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#touchControls{
  display:none;
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:180px;
  z-index:100;
  pointer-events:none;
}

.touch-zone{
  pointer-events:auto;
  position:absolute;
  bottom:20px;
}

.dpad{
  left:15px;
  width:150px;
  height:150px;
}

.dpad-bg{
  width:150px;
  height:150px;
  position:relative;
}

.dpad-btn{
  position:absolute;
  background:rgba(255,255,255,0.07);
  border:2px solid rgba(255,255,255,0.18);
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,0.45);
  font-size:26px;
  transition:background 0.05s;
  -webkit-tap-highlight-color:transparent;
}

.dpad-btn:active,.dpad-btn.pressed{
  background:rgba(255,255,255,0.22);
  border-color:rgba(255,255,255,0.45);
}

.dpad-up{top:0;left:46px;width:58px;height:58px}
.dpad-down{bottom:0;left:46px;width:58px;height:58px}
.dpad-left{top:46px;left:0;width:58px;height:58px}
.dpad-right{top:46px;right:0;width:58px;height:58px}

.action-btns{
  right:15px;
  display:flex;
  gap:14px;
  align-items:flex-end;
}

.action-btn{
  width:70px;
  height:70px;
  border-radius:50%;
  background:rgba(255,255,255,0.07);
  border:2px solid rgba(255,255,255,0.18);
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,0.45);
  font-size:13px;
  font-family:inherit;
  font-weight:bold;
  letter-spacing:1px;
  -webkit-tap-highlight-color:transparent;
}

.action-btn:active,.action-btn.pressed{
  background:rgba(255,255,255,0.22);
  border-color:rgba(255,255,255,0.45);
}

.btn-jump{margin-bottom:40px}
.btn-fire{margin-bottom:0}

@media (max-width:900px),(pointer:coarse){
  #touchControls{display:block}
}

@media (max-width:500px){
  .dpad{width:130px;height:130px}
  .dpad-bg{width:130px;height:130px}
  .dpad-btn{border-radius:10px}
  .dpad-up,.dpad-down{width:50px;height:50px;left:40px}
  .dpad-left,.dpad-right{width:50px;height:50px;top:40px}
  .action-btn{width:62px;height:62px;font-size:11px}
}
</style>

<script>
function checkOrientation(){
  const isMobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(navigator.userAgent);
  const isPortrait = window.innerHeight > window.innerWidth;
  if(isMobile && isPortrait){
    document.body.classList.add('mobile-portrait');
  }else{
    document.body.classList.remove('mobile-portrait');
  }
}

checkOrientation();
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', checkOrientation);

const C=document.getElementById('C'),$=C.getContext('2d');
const W=480,H=270;

const AudioCtx=window.AudioContext||window.webkitAudioContext;
let audioCtx;
function initAudio(){if(!audioCtx)audioCtx=new AudioCtx()}
function snd(freq,dur,type='square',vol=0.06){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,audioCtx.currentTime);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime+dur);
}
function sfxJump(){snd(350,0.12);setTimeout(()=>snd(500,0.08),40)}
function sfxHit(){snd(120,0.25,'sawtooth',0.08)}
function sfxShoot(){snd(700,0.07);setTimeout(()=>snd(550,0.05),25)}
function sfxPickup(){snd(600,0.08);setTimeout(()=>snd(800,0.08),70);setTimeout(()=>snd(1000,0.12),140)}
function sfxDeath(){snd(200,0.35,'sawtooth',0.1);setTimeout(()=>snd(100,0.4,'sawtooth',0.08),180)}
function sfxChest(){snd(400,0.08);setTimeout(()=>snd(600,0.08),90);setTimeout(()=>snd(800,0.12),180)}
function sfxClick(){snd(800,0.04)}

const STORY=[
  {title:'AÑO 1491',subtitle:'La Vega de Granada',text:'Los Reyes Católicos, Isabel y Fernando,\nhan establecido su campamento frente a Granada.\nEl último bastión nazarí resiste.',color:'#ffd700',bg:'#0a0818'},
  {title:'EL INCENDIO',subtitle:'El campamento arde',text:'Un incendio ha arrasado el campamento real.\nPero los Reyes ordenan levantar una nueva ciudad\nde piedra y mortero: SANTA FE.',color:'#ff6030',bg:'#180808'},
  {title:'TU MISIÓN',subtitle:'Caballero de la Reina',text:'Eres un caballero al servicio de Isabel.\nDebes atravesar la Vega, recuperar los pergaminos\nde las Capitulaciones y llegar a Santa Fe.',color:'#60ff60',bg:'#081808'},
  {title:'¡CUIDADO!',subtitle:'Peligros en el camino',text:'Esqueletos, murciélagos y fantasmas\nacechan en las ruinas del campamento.\n¡Ten cuidado, caballero!',color:'#ff4040',bg:'#180808'},
];

const PAL={
  armor:'#b0b8c8',armorLight:'#d0d8e8',armorDark:'#808898',
  gold:'#ffd700',goldDark:'#cc9900',
  skin:'#f0c090',skinDark:'#d0a070',
  pink:'#ff80b0',pinkDark:'#cc5080',
  grass:'#5a9a34',grassLight:'#7aba48',
  dirt:'#6a4a2a',dirtDark:'#4a3018',
  stone:'#6a6a7a',stoneDark:'#4a4a5a',stoneLight:'#8a8a9a',
};

let state='menu',frame=0,shake=0,flashTimer=0,currentLevel=1,maxLevels=3;
let playerWeapon='lance';
let score=0,lives=3,armorOn=true;
let platforms,enemies,projectiles,particles,pickups,chests,decorations,signs;
let camX=0,storyPage=0,storyTimer=0,menuAnim=0;
let levelTransitionTimer=0;
let isTransitioning=false;
const GRAV=0.32,JUMP=-7.2,SPEED=2.0,FIRE_RATE=20;
const LEVEL_W=4800,GROUND_Y=215;

let mathQuiz={
  active:false,
  chest:null,
  question:'',
  answer:0,
  usedQuestions:[],
  input:'',
  correct:false,
  showResult:0,
  keyboard:{buttons:[],hoveredBtn:null}
};

const P={x:40,y:GROUND_Y-28,w:16,h:28,vx:0,vy:0,dir:1,onGround:false,
  attacking:false,attackTimer:0,invuln:0,fireCd:0,anim:0,dead:false,deathTimer:0};

const keys={};
document.addEventListener('keydown',e=>{
  initAudio();
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
  if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')keys.up=true;
  if(e.key==='ArrowDown'||e.key==='s')keys.down=true;
  if(e.key==='z'||e.key==='x'||e.key==='j'||e.key==='k')keys.fire=true;
  if(e.key==='Enter')keys.enter=true;
  
  if(mathQuiz.active){
    if(e.key>='0'&&e.key<='9'){
      if(mathQuiz.input.length<3){
        mathQuiz.input+=e.key;
        sfxClick();
      }
      e.preventDefault();
    }
    if(e.key==='Backspace'){
      mathQuiz.input=mathQuiz.input.slice(0,-1);
      sfxClick();
      e.preventDefault();
    }
    if(e.key==='Enter'){
      if(mathQuiz.input.length>0)checkMathAnswer();
      e.preventDefault();
    }
  }
});

document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
  if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')keys.up=false;
  if(e.key==='ArrowDown'||e.key==='s')keys.down=false;
  if(e.key==='z'||e.key==='x'||e.key==='j'||e.key==='k')keys.fire=false;
  if(e.key==='Enter')keys.enter=false;
});

document.querySelectorAll('[data-key]').forEach(btn=>{
  const k=btn.dataset.key;
  const on=()=>{initAudio();keys[k]=true;btn.classList.add('pressed')};
  const off=()=>{keys[k]=false;btn.classList.remove('pressed')};
  btn.addEventListener('touchstart',e=>{e.preventDefault();on()});
  btn.addEventListener('touchend',e=>{e.preventDefault();off()});
  btn.addEventListener('touchcancel',e=>{e.preventDefault();off()});
  btn.addEventListener('mousedown',on);
  btn.addEventListener('mouseup',off);
  btn.addEventListener('mouseleave',off);
});

let mouseX=0,mouseY=0;
C.addEventListener('mousemove',e=>{
  const rect=C.getBoundingClientRect();
  mouseX=(e.clientX-rect.left)*(W/rect.width);
  mouseY=(e.clientY-rect.top)*(H/rect.height);
});
C.addEventListener('click',e=>{
  initAudio();
  if(mathQuiz.active)handleKeyboardClick();
});
C.addEventListener('touchstart',e=>{
  initAudio();
  if(e.touches.length>0){
    const rect=C.getBoundingClientRect();
    mouseX=(e.touches[0].clientX-rect.left)*(W/rect.width);
    mouseY=(e.touches[0].clientY-rect.top)*(H/rect.height);
    if(mathQuiz.active)handleKeyboardClick();
  }
  e.preventDefault();
});

function handleKeyboardClick(){
  for(const btn of mathQuiz.keyboard.buttons){
    if(mouseX>=btn.x&&mouseX<=btn.x+btn.w&&mouseY>=btn.y&&mouseY<=btn.y+btn.h){
      if(btn.value==='check'){
        if(mathQuiz.input.length>0)checkMathAnswer();
      }else if(btn.value==='back'){
        mathQuiz.input=mathQuiz.input.slice(0,-1);
        sfxClick();
      }else{
        if(mathQuiz.input.length<3){
          mathQuiz.input+=btn.value;
          sfxClick();
        }
      }
      break;
    }
  }
}

function mkSpr(name,w,h,fn){
  const c=document.createElement('canvas');
  c.width=w;
  c.height=h;
  const x=c.getContext('2d');
  fn(x);
  SC[name]=c;
}

const SC={};

    x.fillStyle=armor?'#707888':'#604020';
    x.fillRect(3,0,10,3);
    x.fillStyle=armorColor;
    x.fillRect(2,2,12,6);
    x.fillStyle=armorLight;
    x.fillRect(4,2,8,2);

    x.fillRect(4,8,8,2);
    x.fillStyle='#cc1111';
    x.fillRect(6,10,4,4);
    x.fillRect(5,11,6,2);

    x.fillStyle=armorDark;
    x.fillRect(0,9+a1,3,6);
    x.fillRect(13,9+a2,3,6);
    x.fillStyle=armorColor;
    x.fillRect(0,9+a1,3,4);
    x.fillRect(13,9+a2,3,4);

    x.fillStyle=armorDark;
    x.fillRect(3,16,4,7+l1);
    x.fillRect(9,16,4,7+l2);
    x.fillStyle=armorColor;
    x.fillRect(3,16,4,5);

  mkSpr('ka0',16,28,x=>drawKnight(x,0,0,0,0,true));

  mkSpr('gh1',24,24,x=>{

function generateMathQuestion(){
  const allQuestions=[];
  for(let a=2;a<=9;a++){
    for(let b=2;b<=9;b++){
      allQuestions.push({a:a,b:b,ans:a*b,text:a+' × '+b+' = ?'});
    }
  }
  const available=allQuestions.filter(q=>!mathQuiz.usedQuestions.includes(q.text));
  if(available.length===0){
    mathQuiz.usedQuestions=[];
    return allQuestions[Math.floor(Math.random()*allQuestions.length)];
  }
  const q=available[Math.floor(Math.random()*available.length)];
  mathQuiz.usedQuestions.push(q.text);
  return q;
}

function startMathQuiz(chest){
  mathQuiz.active=true;
  mathQuiz.chest=chest;
  mathQuiz.input='';
  mathQuiz.correct=false;
  mathQuiz.showResult=0;
  const q=generateMathQuestion();
  mathQuiz.question=q.text;
  mathQuiz.answer=q.ans;
  createVirtualKeyboard();
}

function createVirtualKeyboard(){
  mathQuiz.keyboard.buttons=[];
  const btnW=28,btnH=28,gap=4;
  const startX=70,startY=135;
  
  for(let i=0;i<9;i++){
    const row=Math.floor(i/3);
    const col=i%3;
    mathQuiz.keyboard.buttons.push({
      x:startX+col*(btnW+gap),
      y:startY+row*(btnH+gap),
      w:btnW,
      h:btnH,
      value:''+(i+1),
      label:''+(i+1)
    });
  }
  
  mathQuiz.keyboard.buttons.push({
    x:startX,
    y:startY+3*(btnH+gap),
    w:btnW,
    h:btnH,
    value:'0',
    label:'0'
  });
  
  mathQuiz.keyboard.buttons.push({
    x:startX+(btnW+gap),
    y:startY+3*(btnH+gap),
    w:btnW,
    h:btnH,
    value:'back',
    label:'⌫'
  });
  
  mathQuiz.keyboard.buttons.push({
    x:startX+2*(btnW+gap),
    y:startY+3*(btnH+gap),
    w:btnW*2+gap,
    h:btnH,
    value:'check',
    label:'✓'
  });
}

function updateMathQuiz(){
  if(!mathQuiz.active)return;
  mathQuiz.keyboard.hoveredBtn=null;
  for(const btn of mathQuiz.keyboard.buttons){
    if(mouseX>=btn.x&&mouseX<=btn.x+btn.w&&mouseY>=btn.y&&mouseY<=btn.y+btn.h){
      mathQuiz.keyboard.hoveredBtn=btn;
      break;
    }
  }
  if(mathQuiz.showResult>0){
    mathQuiz.showResult--;
    if(mathQuiz.showResult<=0){
      mathQuiz.showResult=0;
      mathQuiz.active=false;
      mathQuiz.chest=null;
      mathQuiz.input='';
    }
  }
}

function checkMathAnswer(){
  if(mathQuiz.input.length===0)return;
  const userAns=parseInt(mathQuiz.input);
  if(userAns===mathQuiz.answer){
    mathQuiz.correct=true;
    mathQuiz.showResult=90;
    sfxChest();
    if(mathQuiz.chest){
      mathQuiz.chest.open=true;
      spawnPk(mathQuiz.chest.x,mathQuiz.chest.y-18,mathQuiz.chest.item);
    }
  }else{
    mathQuiz.correct=false;
    mathQuiz.showResult=60;
    sfxHit();
    mathQuiz.input='';
  }
}

function drawMathQuiz(){
  if(!mathQuiz.active)return;
  $.fillStyle='rgba(0,0,0,0.88)';
  $.fillRect(0,0,W,H);
  const pw=380,ph=240,px=(W-pw)/2,py=(H-ph)/2-10;
  $.fillStyle='rgba(0,0,0,0.5)';
  $.fillRect(px+4,py+4,pw,ph);
  $.fillStyle='#f5f5f5';
  $.fillRect(px,py,pw,ph);
  $.strokeStyle='#0066cc';
  $.lineWidth=5;
  $.strokeRect(px,py,pw,ph);
  $.strokeStyle='#004499';
  $.lineWidth=2;
  $.strokeRect(px+2,py+2,pw-4,ph-4);
  $.font='bold 18px Arial';
  $.fillStyle='#0066cc';
  $.textAlign='center';
  $.fillText('🔒 COFRE BLOQUEADO',W/2,py+25);
  $.font='12px Arial';
  $.fillStyle='#444';
  $.fillText('Resuelve la multiplicación para abrirlo:',W/2,py+45);
  $.font='bold 36px Arial';
  $.fillStyle='#222';
  $.fillText(mathQuiz.question,W/2,py+85);
  const inputW=140,inputH=40,inputX=(W-inputW)/2,inputY=py+100;
  $.fillStyle='rgba(0,0,0,0.2)';
  $.fillRect(inputX+2,inputY+2,inputW,inputH);
  $.fillStyle='#fff';
  $.fillRect(inputX,inputY,inputW,inputH);
  $.strokeStyle='#0066cc';
  $.lineWidth=3;
  $.strokeRect(inputX,inputY,inputW,inputH);
  $.font='bold 32px Arial';
  $.fillStyle='#000';
  const displayText=mathQuiz.input+(Math.floor(Date.now()/500)%2==0?'_':'');
  $.fillText(displayText,W/2,inputY+30);

  for(const btn of mathQuiz.keyboard.buttons){
    const isHovered=mathQuiz.keyboard.hoveredBtn===btn;
    const isCheck=btn.value==='check';
    const isBack=btn.value==='back';
    $.fillStyle='rgba(0,0,0,0.3)';
    $.fillRect(btn.x+2,btn.y+2,btn.w,btn.h);
    if(isCheck){
      $.fillStyle=isHovered?'#00cc00':'#00aa00';
    }else if(isBack){
      $.fillStyle=isHovered?'#ff8800':'#ff6600';
    }else{
      $.fillStyle=isHovered?'#0088ff':'#0066cc';
    }
    $.fillRect(btn.x,btn.y,btn.w,btn.h);
    $.strokeStyle=isHovered?'#fff':'rgba(0,0,0,0.3)';
    $.lineWidth=2;
    $.strokeRect(btn.x,btn.y,btn.w,btn.h);
    if(isHovered){
      $.fillStyle='rgba(255,255,255,0.2)';
      $.fillRect(btn.x,btn.y,btn.w,btn.h/2);
    }
    $.font=isCheck?'bold 20px Arial':'bold 18px Arial';
    $.fillStyle='#fff';
    $.textAlign='center';
    $.fillText(btn.label,btn.x+btn.w/2,btn.y+btn.h/2+7);
  }

  $.font='10px Arial';
  $.fillStyle='#666';
  $.textAlign='center';
  $.fillText('Usa el teclado virtual o el teclado de tu dispositivo',W/2,py+ph-8);

  if(mathQuiz.showResult>0){
    $.fillStyle='rgba(0,0,0,0.75)';
    $.fillRect(px+15,py+60,pw-30,120);
    $.font='bold 32px Arial';
    if(mathQuiz.correct){
      $.fillStyle='#00ff00';
      $.fillText('¡CORRECTO!',W/2,py+110);
      $.font='bold 20px Arial';
      $.fillStyle='#88ff88';
      $.fillText('✓ Cofre abierto',W/2,py+145);
    }else{
      $.fillStyle='#ff4444';
      $.fillText('✗ INCORRECTO',W/2,py+110);
      $.font='bold 18px Arial';
      $.fillStyle='#ffaaaa';
      $.fillText('Intenta de nuevo...',W/2,py+145);
    }
  }
  $.textAlign='left';
}

  for(let i=0;i<cfg.enemyCount;i++){
    const x=300+i*((LEVEL_W-600)/cfg.enemyCount)+Math.random()*50;
    const typeIdx=Math.floor(Math.random()*cfg.enemyTypes.length);
    const type=cfg.enemyTypes[typeIdx];
    const y=type==='bat'?50+Math.random()*100:GROUND_Y-24;
    enemies.push(mkE(x,y,type));
  }

  if(cfg.bossType==='wyvern'){
    enemies.push(mkE(cfg.bossX,GROUND_Y-28,'wyvern'));
  }else{
    enemies.push(mkE(cfg.bossX,GROUND_Y-48,'boabdil'));
  }

  const chestCount=8+currentLevel*2;
  const items=['coin','heart','armor','axe','fireball'];
  for(let i=0;i<chestCount;i++){
    const x=200+i*((LEVEL_W-400)/chestCount);
    const itemIdx=Math.floor(Math.random()*items.length);
    chests.push({x:x,y:GROUND_Y-14,w:16,h:14,item:items[itemIdx],open:false});
  }

  for(let x=60;x<LEVEL_W;x+=Math.random()*400+300){
    decorations.push({x,y:GROUND_Y-28,type:'tent'});
  }

  showLevelMessage();
}

function mkE(x,y,type){
  const e={x,y,type,vx:0,vy:0,hp:1,dead:false,anim:0,w:16,h:24,dir:-1,
    shootTimer:0,emerging:false,emergeY:0,spawnX:x,spawnY:y,active:false,
    patrolRange:200,retreatTimer:0};
  switch(type){
    case 'skeleton':e.h=24;e.hp=1;e.vx=0.5;e.emerging=true;e.emergeY=y;e.y=y+18;break;
    case 'ghost':e.w=24;e.h=24;e.hp=3;e.patrolRange=180;break;
    case 'bat':e.w=18;e.h=12;e.hp=1;e.vx=-2;break;
    case 'wyvern':e.w=32;e.h=28;e.hp=5;break;
    case 'boabdil':e.w=48;e.h=48;e.hp=20;e.vx=1.2;break;
  }
  return e;
}

function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function update(){
  // ARREGLADO: Manejar transición de nivel primero
  if(isTransitioning){
    levelTransitionTimer--;
    if(levelTransitionTimer<=0){
      completeLevelTransition();
    }
    frame++;
    return;
  }

  if(state==='story'){
    storyTimer++;
    if((keys.enter||keys.fire)&&storyTimer>20){
      storyPage++;
      storyTimer=0;
      keys.enter=false;
      keys.fire=false;
      if(storyPage>=STORY.length){
        state='playing';
        startGame_();
      }
    }
    return;
  }
  
  if(state!=='playing')return;
  if(mathQuiz.active){
    updateMathQuiz();
    return;
  }
  
  frame++;

  if(!P.dead){
    P.vx=0;
    if(keys.left){P.vx=-SPEED;P.dir=-1;}
    if(keys.right){P.vx=SPEED;P.dir=1;}
    if(keys.up&&P.onGround){
      P.vy=JUMP;
      P.onGround=false;
      sfxJump();
    }
    P.vy+=GRAV;
    if(P.vy>8)P.vy=8;
    P.x+=P.vx;
    for(const p of platforms){
      if(overlap(P,p)){
        if(P.vx>0)P.x=p.x-P.w;
        if(P.vx<0)P.x=p.x+p.w;
      }
    }
    P.y+=P.vy;
    P.onGround=false;
    for(const p of platforms){
      if(overlap(P,p)){
        if(P.vy>0){
          P.y=p.y-P.h;
          P.vy=0;
          P.onGround=true;
        }else if(P.vy<0){
          P.y=p.y+p.h;
          P.vy=0;
        }
      }
    }
    
    if(P.y>H+100||P.y<-100||isNaN(P.x)||isNaN(P.y)){
      P.x=100;
      P.y=GROUND_Y-50;
      P.vx=0;
      P.vy=0;
      camX=0;
    }
    if(P.x<0)P.x=0;
    if(P.x>LEVEL_W-P.w)P.x=LEVEL_W-P.w;
    if(P.y>H+60)pDeath();

    if(keys.fire&&P.fireCd<=0){
      P.attacking=true;
      P.attackTimer=12;
      P.fireCd=FIRE_RATE;
      sfxShoot();
      let projW=16,projH=6,projVx=P.dir*4.5,projVy=0,projLife=80,damage=1;
      if(playerWeapon==='axe'){
        projW=20;
        projH=12;
        projVx=P.dir*6;
        damage=2;
      }
      if(playerWeapon==='fireball'){
        projW=14;
        projH=14;
        projVx=P.dir*5;
        projVy=-1;
        projLife=100;
        damage=3;
      }
      projectiles.push({
        x:P.x+(P.dir>0?P.w:-projW),
        y:P.y+10,
        vx:projVx,
        vy:projVy,
        w:projW,
        h:projH,
        player:true,
        life:projLife,
        damage:damage,
        weapon:playerWeapon
      });
    }
    if(P.fireCd>0)P.fireCd--;
    if(P.attackTimer>0)P.attackTimer--;
    else P.attacking=false;
    if(P.invuln>0)P.invuln--;
    if(Math.abs(P.vx)>0.1)P.anim+=0.18;
    else P.anim=0;

    for(const c of chests){
      if(!c.open&&overlap(P,c)&&!mathQuiz.active){
        startMathQuiz(c);
      }
    }
    
    for(let i=pickups.length-1;i>=0;i--){
      const pk=pickups[i];
      if(overlap(P,pk)){
        sfxPickup();
        if(pk.type==='heart')lives=Math.min(lives+1,5);
        else if(pk.type==='armor'){
          armorOn=true;
          P.invuln=60;
        }
        else if(pk.type==='coin')score+=500;
        else if(pk.type==='scroll')score+=1000;
        else if(pk.type==='axe'){
          playerWeapon='axe';
          score+=200;
          sfxPickup();
        }
        else if(pk.type==='fireball'){
          playerWeapon='fireball';
          score+=300;
          sfxPickup();
        }
        spawnParts(pk.x+6,pk.y+6,8,'#ffd700');
        pickups.splice(i,1);
      }
    }

    for(const s of signs){
      if(Math.abs(P.x-s.x)<60&&!s.shown){
        s.shown=true;
        s.timer=280;
      }
      if(s.timer>0)s.timer--;
    }
  } else {
    P.deathTimer--;
    if(P.deathTimer<=0){
      if(lives<=0)state='gameover';
      else respawn();
    }
  }

  // ARREGLADO: Sistema de proyectiles simplificado
  for(let i=projectiles.length-1;i>=0;i--){
    const pr=projectiles[i];
    pr.x+=pr.vx;
    pr.y+=pr.vy;
    pr.life--;
    
    if(pr.life<=0||pr.y>H+20||pr.x<0||pr.x>LEVEL_W){
      projectiles.splice(i,1);
      continue;
    }
    
    if(pr.player){
      let hit=false;
      for(let j=0;j<enemies.length;j++){
        const e=enemies[j];
        if(!e.dead&&e.active&&overlap(pr,e)){
          e.hp-=(pr.damage||1);
          spawnParts(pr.x,pr.y,5,'#ff0');
          hit=true;
          
          if(e.hp<=0){
            e.dead=true;
            if(e.type==='boabdil')score+=5000;
            else if(e.type==='ghost')score+=500;
            else if(e.type==='wyvern')score+=300;
            else score+=100;
            
            spawnParts(e.x+e.w/2,e.y+e.h/2,15,'#ff4040');
            
            // ARREGLADO: Lógica de cambio de nivel simplificada
            if((e.type==='boabdil' || e.type==='wyvern') && currentLevel<maxLevels){
              currentLevel++;
              startNextLevel();
            }else if((e.type==='boabdil' || e.type==='wyvern') && currentLevel>=maxLevels){
              state='victory';
              shake=20;
            }
          }
          break;
        }
      }
      if(hit){
        projectiles.splice(i,1);
        continue;
      }
    }else{
      if(!P.dead&&P.invuln<=0&&overlap(pr,P)){
        pHit();
        projectiles.splice(i,1);
      }
    }
  }

  // Enemigos
  for(const e of enemies){
    if(e.dead)continue;
    if(!e.active&&Math.abs(e.spawnX-P.x)<320)e.active=true;
    if(!e.active)continue;
    e.anim++;

    switch(e.type){
      case 'skeleton':
        if(e.emerging){
          e.y-=0.4;
          if(e.y<=e.emergeY){
            e.y=e.emergeY;
            e.emerging=false;
          }
        }else{
          e.dir=P.x<e.x?-1:1;
          e.x+=e.vx*e.dir;
          e.vy+=GRAV;
          e.y+=e.vy;
          for(const p of platforms){
            if(overlap(e,p)&&e.vy>0){
              e.y=p.y-e.h;
              e.vy=0;
            }
          }
          if(e.y>H+50)e.dead=true;
        }
        break;

      case 'ghost':{
        const dx=P.x-e.x,dy=P.y-e.y,d=Math.sqrt(dx*dx+dy*dy)||1;
        const distFS=Math.abs(e.x-e.spawnX);
        if(distFS>e.patrolRange)e.retreatTimer=80;
        if(e.retreatTimer>0){
          e.retreatTimer--;
          const tx=e.spawnX-e.x,ty=e.spawnY-e.y,td=Math.sqrt(tx*tx+ty*ty)||1;
          e.x+=(tx/td)*1.5;
          e.y+=(ty/td)*1.5;
        }else if(d<220){
          const ang=Math.atan2(dy,dx),wave=Math.sin(e.anim*0.04)*1.5;
          if(e.anim%140<100){
            e.x+=Math.cos(ang)*0.7+Math.cos(e.anim*0.05)*wave;
            e.y+=Math.sin(ang)*0.5+Math.sin(e.anim*0.05)*wave;
          }else{
            e.x+=Math.sin(e.anim*0.1)*0.3;
            e.y+=Math.cos(e.anim*0.1)*0.3;
          }
        }else{
          e.x=e.spawnX+Math.sin(e.anim*0.02)*35;
          e.y=e.spawnY+Math.cos(e.anim*0.03)*15;
        }
        e.dir=dx<0?-1:1;
        if(e.y<25)e.y=25;
        if(e.y>GROUND_Y-e.h)e.y=GROUND_Y-e.h;
        break;
      }

      case 'bat':
        e.x+=e.vx;
        e.y+=Math.sin(e.anim*0.07)*1.2;
        if(e.x<camX-40)e.x=camX+W+20;
        break;

      case 'wyvern':
        e.dir=P.x<e.x?-1:1;
        e.shootTimer++;
        e.y=e.spawnY+Math.sin(e.anim*0.05)*3;
        if(e.shootTimer>180){
          e.shootTimer=0;
          const dx=P.x-e.x,dy=P.y-e.y,d=Math.sqrt(dx*dx+dy*dy)||1;
          if(d<300){
            projectiles.push({
              x:e.x+16,
              y:e.y+14,
              vx:(dx/d)*3,
              vy:(dy/d)*3,
              w:6,
              h:6,
              player:false,
              life:120
            });
          }
        }
        break;

      case 'boabdil':
        e.x+=e.vx;
        if(e.x>4600||e.x<4100)e.vx*=-1;
        e.dir=P.x<e.x?-1:1;
        if(e.anim%150===0)e.vy=-7;
        e.vy+=GRAV;
        e.y+=e.vy;
        for(const p of platforms){
          if(overlap(e,p)&&e.vy>0){
            e.y=p.y-e.h;
            e.vy=0;
          }
        }
        if(e.anim%100===0){
          const dx=P.x-e.x,dy=P.y-e.y,d=Math.sqrt(dx*dx+dy*dy)||1;
          projectiles.push({
            x:e.x+24,
            y:e.y+24,
            vx:(dx/d)*2.2,
            vy:(dy/d)*2.2,
            w:7,
            h:7,
            player:false,
            life:120
          });
        }
        break;
    }
    if(!P.dead&&P.invuln<=0&&!e.dead&&overlap(e,P))pHit();
  }

  for(const pk of pickups){
    pk.ft=(pk.ft||0)+0.05;
    pk.dy=pk.y+Math.sin(pk.ft)*3;
    pk.life--;
    if(pk.life<=0)pickups.splice(pickups.indexOf(pk),1);
  }
  
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=0.08;
    p.life--;
    if(p.life<=0)particles.splice(i,1);
  }

  const ct=P.x-W/3;
  camX+=(ct-camX)*0.08;
  if(camX<0)camX=0;
  if(camX>LEVEL_W-W)camX=LEVEL_W-W;
  if(shake>0){
    shake*=0.9;
    if(shake<0.5)shake=0;
  }
  if(flashTimer>0)flashTimer--;
  if(levelMessageTimer>0)levelMessageTimer--;
}

function pHit(){
  if(P.invuln>0||P.dead)return;
  sfxHit();
  shake=6;
  flashTimer=5;
  if(armorOn){
    armorOn=false;
    P.invuln=100;
    spawnParts(P.x+8,P.y+14,12,PAL.armor);
  }else pDeath();
}

function pDeath(){
  P.dead=true;
  P.deathTimer=80;
  lives--;
  sfxDeath();
  shake=10;
  spawnParts(P.x+8,P.y+14,20,'#ff3030');
}

function respawn(){
  P.dead=false;
  P.x=Math.max(0,P.x-200);
  P.y=100;
  P.vx=0;
  P.vy=0;
  P.invuln=120;
  armorOn=true;
}

function spawnPk(x,y,type){
  pickups.push({
    x,y,dy:y,
    w:type==='coin'?10:12,
    h:type==='scroll'?14:12,
    type,
    life:600,
    ft:0
  });
}

function spawnParts(x,y,n,col){
  for(let i=0;i<n;i++){
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*5,
      vy:(Math.random()-0.5)*5-2,
      life:18+Math.random()*18,
      color:col,
      size:1+Math.random()*2
    });
  }
}

function draw(){
  $.fillStyle='#000';
  $.fillRect(0,0,W,H);
  if(state==='menu'){drawMenu();return;}
  if(state==='story'){drawStory();return;}
  if(state==='gameover'){drawGO();return;}
  if(state==='victory'){drawWin();return;}

  const sx=shake?(Math.random()-0.5)*shake:0;
  const sy=shake?(Math.random()-0.5)*shake:0;
  $.save();
  $.translate(sx,sy);
  drawBg();
  $.save();
  $.translate(-Math.floor(camX),0);
  drawPlats();
  drawDeco();
  drawChests();
  drawPks();
  drawProjs();
  drawEns();
  if(!P.dead)drawP();
  drawParts();
  drawCastle();
  $.restore();
  
  if(flashTimer>0){
    $.fillStyle=`rgba(255,255,255,${flashTimer/8})`;
    $.fillRect(0,0,W,H);
  }
  
  // ARREGLADO: Mostrar mensaje de transición
  if(isTransitioning){
    $.fillStyle='rgba(0,0,0,0.7)';
    $.fillRect(0,0,W,H);
    $.font='bold 20px Arial';
    $.fillStyle='#ffd700';
    $.textAlign='center';
    $.fillText('¡NIVEL COMPLETADO!',W/2,H/2);
    $.font='14px Arial';
    $.fillStyle='#fff';
    $.fillText('Cargando siguiente nivel...',W/2,H/2+30);
    $.textAlign='left';
  }
  
  drawHUD();
  drawLore();
  drawMathQuiz();
  $.restore();
}

function drawBg(){
  const g=$.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#030610');
  g.addColorStop(0.3,'#0a1530');
  g.addColorStop(0.6,'#15254a');
  g.addColorStop(1,'#1a3060');
  $.fillStyle=g;
  $.fillRect(0,0,W,H);
  
  for(let i=0;i<50;i++){
    const sx=((i*137+42)%W+camX*0.015)%W;
    const sy=((i*97+126)%140);
    const b=0.3+((i*73)%100)/100*0.7;
    const tw=Math.sin(frame*0.025+i)*0.3+0.7;
    $.fillStyle=`rgba(255,255,255,${b*tw})`;
    $.fillRect(sx,sy,(i%3===0)?2:1,(i%3===0)?2:1);
  }
  
  const mx=W*0.82-camX*0.008,my=35;
  const mg=$.createRadialGradient(mx,my,8,mx,my,45);
  mg.addColorStop(0,'rgba(254,243,199,0.18)');
  mg.addColorStop(1,'rgba(254,243,199,0)');
  $.fillStyle=mg;
  $.beginPath();
  $.arc(mx,my,45,0,Math.PI*2);
  $.fill();
  $.fillStyle='#fef3c7';
  $.beginPath();
  $.arc(mx,my,14,0,Math.PI*2);
  $.fill();
  $.fillStyle='#f0dfa0';
  $.beginPath();
  $.arc(mx-2,my-1,12,0,Math.PI*2);
  $.fill();

  $.fillStyle='#080e22';
  for(let i=0;i<14;i++){
    const bx=i*110-(camX*0.04)%110;
    const bh=35+((i*71)%35);
    drawMtn(bx,H-55,110,bh);
  }
  $.fillStyle='#0c1630';
  for(let i=0;i<11;i++){
    const bx=i*140-(camX*0.08)%140;
    const bh=25+((i*53)%22);
    drawMtn(bx,H-45,140,bh);
  }
  $.fillStyle='#101e38';
  for(let i=0;i<9;i++){
    const bx=i*170-(camX*0.15)%170;
    const bh=20+((i*37)%18);
    drawMtn(bx,H-35,170,bh);
  }
  $.fillStyle='rgba(20,40,80,0.12)';
  $.fillRect(0,H-70,W,25);
}

function drawMtn(x,by,w,h){
  $.beginPath();
  $.moveTo(x,by);
  $.lineTo(x+w*0.3,by-h*0.7);
  $.lineTo(x+w*0.45,by-h);
  $.lineTo(x+w*0.65,by-h*0.65);
  $.lineTo(x+w,by);
  $.fill();
}

function drawPlats(){
  for(const p of platforms){
    if(p.x+p.w<camX-20||p.x>camX+W+20)continue;
    if(p.type==='ground'){
      $.fillStyle=PAL.dirt;
      $.fillRect(p.x,p.y,p.w,p.h);
      $.fillStyle=PAL.dirtDark;
      $.fillRect(p.x,p.y+8,p.w,p.h-8);
      $.fillStyle=PAL.grass;
      $.fillRect(p.x,p.y,p.w,5);
      $.fillStyle=PAL.grassLight;
      $.fillRect(p.x,p.y,p.w,2);
      for(let gx=p.x;gx<p.x+p.w;gx+=7){
        const gh=2+((gx*7)%3);
        $.fillStyle=PAL.grassLight;
        $.fillRect(gx,p.y-gh,2,gh);
      }
      $.fillStyle='rgba(0,0,0,0.08)';
      for(let dx=p.x;dx<p.x+p.w;dx+=11){
        for(let dy=p.y+7;dy<p.y+p.h;dy+=9){
          $.fillRect(dx+((dy*3)%7),dy,2,2);
        }
      }
    }else if(p.type==='float'){
      $.fillStyle=PAL.stone;
      $.fillRect(p.x,p.y,p.w,p.h);
      $.fillStyle=PAL.stoneLight;
      $.fillRect(p.x,p.y,p.w,3);
      $.fillStyle=PAL.stoneDark;
      $.fillRect(p.x,p.y+p.h-3,p.w,3);
      $.fillStyle='rgba(60,140,40,0.3)';
      $.fillRect(p.x+2,p.y,3,2);
      $.fillRect(p.x+p.w-6,p.y,4,2);
    }else if(p.type==='bridge'){
      $.fillStyle='#6a4a2a';
      $.fillRect(p.x,p.y,p.w,p.h);
      $.fillStyle='#8a6a3a';
      $.fillRect(p.x,p.y,p.w,3);
    }
  }
}

function drawDeco(){
  for(const d of decorations){
    if(d.x<camX-40||d.x>camX+W+40)continue;
    if(SC[d.type])$.drawImage(SC[d.type],d.x,d.y);
  }
}

function drawChests(){
  for(const c of chests){
    if(c.x<camX-20||c.x>camX+W+20)continue;
    $.drawImage(SC[c.open?'ch1':'ch0'],c.x,c.y);
  }
}

function drawPks(){
  for(const pk of pickups){
    if(pk.x<camX-20||pk.x>camX+W+20)continue;
    const dy=pk.dy||pk.y;
    const s=pk.type==='heart'?'heart':pk.type==='armor'?'armor_pk':pk.type==='scroll'?'scroll':'coin';
    $.fillStyle='rgba(255,215,0,0.12)';
    $.beginPath();
    $.arc(pk.x+6,dy+6,10,0,Math.PI*2);
    $.fill();
    $.drawImage(SC[s],pk.x,dy);
  }
}

function drawProjs(){
  for(const pr of projectiles){
    if(pr.player){
      $.save();
      $.translate(pr.x,pr.y);
      if(pr.vx<0){
        $.scale(-1,1);
        $.translate(-pr.w,0);
      }
      if(pr.weapon==='axe'){
        $.drawImage(SC['axe'],0,0);
        $.strokeStyle='#ff6666';
        $.lineWidth=2;
        $.beginPath();
        $.arc(pr.w/2,pr.h/2,8,0,Math.PI*2);
        $.stroke();
      }else if(pr.weapon==='fireball'){
        $.drawImage(SC['fireball'],0,0);
        $.fillStyle='rgba(255,100,0,0.3)';
        $.fillRect(-5,2,5,pr.h-4);
      }else{
        $.drawImage(SC['lance'],0,0);
      }
      $.restore();
    }else{
      $.fillStyle='#ff4020';
      $.beginPath();
      $.arc(pr.x+3,pr.y+3,3.5,0,Math.PI*2);
      $.fill();
      $.fillStyle='#ffaa00';
      $.beginPath();
      $.arc(pr.x+3,pr.y+3,1.5,0,Math.PI*2);
      $.fill();
    }
  }
}

function drawEns(){
  for(const e of enemies){
    if(e.dead||!e.active||e.x+e.w<camX-30||e.x>camX+W+30)continue;
    $.save();
    const fl=e.dir<0;
    switch(e.type){
      case 'skeleton':{
        const fr=Math.floor(e.anim/12)%2;
        if(fl){
          $.translate(e.x+e.w,e.y);
          $.scale(-1,1);
        }else{
          $.translate(e.x,e.y);
        }
        $.drawImage(SC['sk'+fr],0,0);
        break;
      }
      case 'ghost':{
        const fr=Math.floor(e.anim/10)%2;
        $.fillStyle='rgba(30,100,180,0.08)';
        $.beginPath();
        $.arc(e.x+12,e.y+12,20,0,Math.PI*2);
        $.fill();
        if(fl){
          $.translate(e.x+e.w,e.y);
          $.scale(-1,1);
        }else{
          $.translate(e.x,e.y);
        }
        $.drawImage(SC['gh'+fr],0,0);
        break;
      }
      case 'bat':{
        const fr=Math.floor(e.anim/6)%2;
        $.translate(e.x,e.y);
        $.drawImage(SC['bt'+fr],0,0);
        break;
      }
      case 'wyvern':{
        const fr=e.shootTimer>150?1:0;
        if(fl){
          $.translate(e.x+e.w,e.y);
          $.scale(-1,1);
        }else{
          $.translate(e.x,e.y);
        }
        $.drawImage(SC['wv'+fr],0,0);
        $.restore();
        $.save();
        const bx=e.x,by=e.y-10;
        $.fillStyle='rgba(0,0,0,0.7)';
        $.fillRect(bx,by,32,5);
        $.fillStyle='#300';
        $.fillRect(bx+1,by+1,30,3);
        $.fillStyle='#ff4400';
        $.fillRect(bx+1,by+1,30*(e.hp/5),3);
        break;
      }
      case 'boabdil':{
        if(fl){
          $.translate(e.x+e.w,e.y);
          $.scale(-1,1);
        }else{
          $.translate(e.x,e.y);
        }
        $.drawImage(SC['boabdil'],0,0);
        $.restore();
        $.save();
        const bx=e.x,by=e.y-14;
        $.fillStyle='rgba(0,0,0,0.7)';
        $.fillRect(bx-2,by-1,54,8);
        $.fillStyle='#300';
        $.fillRect(bx,by,50,6);
        $.fillStyle='#c02020';
        $.fillRect(bx,by,50*(e.hp/20),6);
        $.fillStyle='#ff4040';
        $.fillRect(bx,by,50*(e.hp/20),3);
        $.font='bold 6px Arial';
        $.fillStyle='#fff';
        $.textAlign='center';
        $.fillText('REY BOABDIL',bx+25,by-3);
        $.textAlign='left';
        break;
      }
    }
    $.restore();
  }
}

function drawP(){
  $.save();
  if(P.invuln>0&&Math.floor(P.invuln/3)%2)$.globalAlpha=0.4;
  const pre=armorOn?'ka':'kb';
  let spr;
  if(P.attacking&&armorOn)spr='ka_a';
  else if(!P.onGround&&armorOn)spr='ka_j';
  else{
    const fr=Math.floor(P.anim)%3;
    spr=pre+fr;
  }
  const s=SC[spr];
  if(!s){
    $.restore();
    return;
  }
  if(P.dir<0){
    $.translate(P.x+P.w,P.y);
    $.scale(-1,1);
    $.drawImage(s,0,0);
  }else{
    $.drawImage(s,P.x,P.y);
  }
  $.restore();
}

function drawParts(){
  for(const p of particles){
    $.fillStyle=p.color;
    $.globalAlpha=Math.min(1,p.life/10);
    $.fillRect(p.x,p.y,p.size,p.size);
  }
  $.globalAlpha=1;
}

  const cx=LEVEL_W-280;

  $.fillStyle='#1a1a2e';

    $.fillRect(tx+3,GROUND_Y-115,34,110);
    for(let b=0;b<4;b++){
      $.fillStyle='#b09050';
      $.fillRect(tx+b*10,GROUND_Y-128,8,10);
    }
    $.fillStyle='#ffa040';
    $.fillRect(tx+13,GROUND_Y-100,14,18);
    $.fillStyle='#ff8020';
    $.fillRect(tx+15,GROUND_Y-98,10,14);

    $.fillRect(tx+19,GROUND_Y-100,2,18);
  }
  
  $.fillStyle='#604020';
  $.fillRect(cx+75,GROUND_Y-55,70,55);

  $.fillRect(cx+80,GROUND_Y-50,60,50);
  $.fillStyle='#c0a060';
  $.beginPath();
  $.arc(cx+110,GROUND_Y-55,35,Math.PI,0);
  $.fill();
  $.fillStyle='#d4b880';
  $.beginPath();
  $.arc(cx+110,GROUND_Y-55,30,Math.PI,0);
  $.fill();
  $.fillStyle=PAL.gold;
  $.fillRect(cx+100,GROUND_Y-95,20,20);
  $.fillStyle='#cc1111';
  $.fillRect(cx+102,GROUND_Y-93,16,16);
  $.fillStyle=PAL.gold;
  $.fillRect(cx+107,GROUND_Y-91,6,12);
  $.fillRect(cx+104,GROUND_Y-87,12,4);
  
  const fw=Math.sin(frame*0.07)*3;
  for(let t=0;t<3;t++){
    const tx=cx+t*90+18;
    $.fillStyle='#604020';
    $.fillRect(tx,GROUND_Y-138,2,16);
    $.fillStyle='#cc1111';
    $.fillRect(tx+2,GROUND_Y-138+fw,10,6);
    $.fillStyle=PAL.gold;
    $.fillRect(tx+4,GROUND_Y-136+fw,1,4);
    $.fillRect(tx+3,GROUND_Y-135+fw,3,1);
  }
  
  $.font='bold 8px Arial';
  $.fillStyle=PAL.gold;
  $.textAlign='center';
  $.fillText('SANTA FE',cx+110,GROUND_Y-62);
  $.textAlign='left';
}

function drawHUD(){
  $.fillStyle='rgba(0,0,0,0.5)';
  $.fillRect(0,0,W,22);
  $.fillStyle='#ff3060';
  $.font='bold 14px Arial';
  $.fillText('♥',6,14);
  $.fillStyle='#fff';
  $.fillText('×'+lives,16,14);
  
  if(armorOn){
    $.fillStyle=PAL.armor;
    $.fillRect(48,5,10,12);
    $.fillStyle='#cc1111';
    $.fillRect(50,8,6,4);
  }else{
    $.fillStyle=PAL.pink;
    $.fillRect(48,5,10,12);
    $.fillStyle='#fff';
    $.fillRect(51,7,4,1);
  }
  
  $.fillStyle=PAL.gold;
  $.textAlign='right';
  $.fillText('SCORE '+String(score).padStart(7,'0'),W-8,14);
  $.textAlign='left';
  
  const weaponNames={'lance':'LANZA','axe':'HACHA','fireball':'FUEGO'};
  const weaponColors={'lance':'#aaa','axe':'#ff6666','fireball':'#ff8800'};
  $.fillStyle=weaponColors[playerWeapon]||'#aaa';
  $.fillText(weaponNames[playerWeapon]||'LANZA',78,14);
  
  if(levelMessageTimer>0){
    $.fillStyle='rgba(0,0,0,0.7)';
    $.fillRect(0,50,W,30);
    $.font='bold 16px Arial';
    $.fillStyle='#ffd700';
    $.textAlign='center';
    $.fillText(currentLevelName,W/2,70);
    $.textAlign='left';
  }
  
  const boss=enemies&&enemies.find(e=>e.type==='boabdil'&&!e.dead&&e.active);
  if(boss){
    $.fillStyle='rgba(0,0,0,0.6)';
    $.fillRect(W/2-65,1,130,19);
    $.fillStyle='#ddd';
    $.font='bold 7px Arial';
    $.textAlign='center';
    $.fillText('⚔ DRAGÓN GUARDIÁN ⚔',W/2,10);
    $.fillStyle='#300';
    $.fillRect(W/2-50,13,100,5);
    $.fillStyle='#c02020';
    $.fillRect(W/2-50,13,100*(boss.hp/20),5);
    $.fillStyle='#ff4040';
    $.fillRect(W/2-50,13,100*(boss.hp/20),2);
    $.textAlign='left';
  }
}

function drawLore(){
  for(const s of signs){
    if(s.timer>0){
      const a=Math.min(1,s.timer/30,Math.min(1,(280-s.timer+30)/30));
      $.save();
      $.globalAlpha=a;
      const bw=230,bh=42,bx=(W-bw)/2,by=H-58;
      $.fillStyle='rgba(240,240,245,0.95)';
      $.fillRect(bx,by,bw,bh);
      $.strokeStyle='rgba(0,80,150,0.6)';
      $.lineWidth=1;
      $.strokeRect(bx,by,bw,bh);
      $.fillStyle='#d4b880';
      $.font='12px Arial';
      $.textAlign='center';
      const lines=s.text.split('\n');
      for(let i=0;i<lines.length;i++)$.fillText(lines[i],W/2,by+12+i*12);
      $.textAlign='left';
      $.restore();
    }
  }
}

function drawMenu(){
  menuAnim++;
  const g=$.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a1a2e');
  g.addColorStop(0.4,'#16213e');
  g.addColorStop(1,'#0f3460');
  $.fillStyle=g;
  $.fillRect(0,0,W,H);
  
  for(let i=0;i<25;i++){
    const px=(i*47+menuAnim*0.25)%W;
    const py=(i*31+menuAnim*0.4)%H;
    $.fillStyle=`rgba(255,200,100,${0.05+((i*7)%10)/40})`;
    $.fillRect(px,py,2,2);
  }
  
  $.fillStyle='rgba(255,200,100,0.03)';
  $.fillRect(W/2-120,H-80,240,50);
  for(let i=0;i<5;i++)$.fillRect(W/2-100+i*45,H-95,20,30);

  $.save();
  $.textAlign='center';
  $.font='bold 14px Arial';
  $.fillStyle='rgba(255,215,0,0.35)';
  $.fillText('CEIP CAPITULACIONES PRESENTA',W/2,30);
  $.font='bold 28px Arial';
  $.fillStyle='#8a5500';
  $.fillText('EL CABALLERO',W/2+2,62);
  $.fillStyle=PAL.gold;
  $.fillText('EL CABALLERO',W/2,60);
  $.fillStyle='#5a1111';
  $.fillText('DE SANTA FE',W/2+2,92);
  $.fillStyle='#ff4040';
  $.fillText('DE SANTA FE',W/2,90);
  $.font='bold 14px Arial';
  $.fillStyle='#c0a060';
  $.fillText('★ SANTA FE · GRANADA · 1491 ★',W/2,112);
  $.font='13px Arial';
  $.fillStyle='#7a7a9a';
  $.fillText('Recupera los pergaminos de la paz',W/2,130);
  $.fillText('y llega a las puertas de Santa Fe',W/2,142);
  
  const btnY=165,hov=Math.sin(menuAnim*0.06)*2;
  $.fillStyle='rgba(255,255,255,0.06)';
  $.fillRect(W/2-75,btnY+hov-2,150,26);
  $.strokeStyle='rgba(255,255,255,0.3)';
  $.lineWidth=1;
  $.strokeRect(W/2-75,btnY+hov-2,150,26);
  $.fillStyle='#fff';
  $.font='bold 14px Arial';
  $.fillText('▶ COMENZAR',W/2,btnY+hov+15);
  
  if(Math.floor(menuAnim/30)%2){
    $.fillStyle=PAL.gold;
    $.font='13px Arial';
    $.fillText('PULSA ENTER O TOCA PARA EMPEZAR',W/2,210);
  }
  
  $.font='9px Arial';
  $.fillStyle='#444';
  $.fillText('← → MOVERSE  |  ↑/ESPACIO SALTO  |  Z/X ATACAR',W/2,240);
  $.fillText('Basado en Fantasmas \'n Aventura (Capcom, 1985) · Ambientado en hechos reales',W/2,252);
  $.restore();
  
  if(keys.enter||keys.fire||keys.up){
    initAudio();
    state='story';
    storyPage=0;
    storyTimer=0;
    keys.enter=false;
    keys.fire=false;
    keys.up=false;
  }
}

function drawStory(){
  storyTimer++;
  const pg=STORY[storyPage];
  if(!pg){
    state='playing';
    return;
  }
  $.fillStyle=pg.bg;
  $.fillRect(0,0,W,H);
  $.strokeStyle='rgba(200,160,80,0.15)';
  $.lineWidth=2;
  $.strokeRect(20,15,W-40,H-30);
  $.save();
  $.textAlign='center';
  $.globalAlpha=Math.min(1,storyTimer/40);
  $.font='bold 24px Arial';
  $.fillStyle=pg.color;
  $.fillText(pg.title,W/2,65);
  if(pg.subtitle){
    $.font='bold 14px Arial';
    $.fillStyle='#aaccff';
    $.fillText(pg.subtitle,W/2,85);
  }
  $.font='12px Arial';
  $.fillStyle='#ffffff';
  const lines=pg.text.split('\n');
  for(let i=0;i<lines.length;i++)$.fillText(lines[i],W/2,115+i*18);
  if(storyTimer>20&&Math.floor(storyTimer/20)%2){
    $.font='12px Arial';
    $.fillStyle='#888';
    $.fillText('PULSA ENTER PARA CONTINUAR →',W/2,H-25);
  }
  $.fillStyle='#555';
  for(let i=0;i<STORY.length;i++){
    $.fillStyle=i===storyPage?pg.color:'#333';
    $.fillRect(W/2-20+i*12,H-12,8,4);
  }
  $.restore();
}

function drawGO(){
  $.fillStyle='rgba(0,0,0,0.88)';
  $.fillRect(0,0,W,H);
  $.save();
  $.textAlign='center';
  const gs=Math.sin(frame*0.1)*2;
  $.font='bold 28px Arial';
  $.fillStyle='#500';
  $.fillText('GAME OVER',W/2+2,H/2+gs+2);
  $.fillStyle='#ff2020';
  $.fillText('GAME OVER',W/2,H/2+gs);
  $.font='bold 11px Arial';
  $.fillStyle=PAL.gold;
  $.fillText('SCORE: '+String(score).padStart(7,'0'),W/2,H/2+28);
  $.font='13px Arial';
  $.fillStyle='#aaa';
  $.fillText('Granada sigue sin conquistar...',W/2,H/2+46);
  if(Math.floor(frame/25)%2){
    $.fillStyle='#777';
    $.fillText('PULSA ENTER PARA REINTENTAR',W/2,H/2+68);
  }
  $.restore();
  if(keys.enter||keys.fire){
    state='menu';
    keys.enter=false;
    keys.fire=false;
  }
}

function drawWin(){
  $.fillStyle='rgba(0,0,0,0.82)';
  $.fillRect(0,0,W,H);
  $.save();
  $.textAlign='center';
  for(let i=0;i<10;i++){
    const a=frame*0.02+i*0.63;
    const r=40+Math.sin(frame*0.03+i)*20;
    $.fillStyle=`rgba(255,215,0,${0.15+Math.sin(frame*0.05+i)*0.1})`;
    $.beginPath();
    $.arc(W/2+Math.cos(a)*r,H/2-20+Math.sin(a)*r*0.5,3,0,Math.PI*2);
    $.fill();
  }
  $.font='bold 24px Arial';
  $.fillStyle='#8a6600';
  $.fillText('¡VICTORIA!',W/2+2,H/2-28);
  $.fillStyle=PAL.gold;
  $.fillText('¡VICTORIA!',W/2,H/2-30);
  $.font='13px Arial';
  $.fillStyle='#d0d0e0';
  $.fillText('¡Has completado todos los niveles!',W/2,H/2);
  $.fillText('Has llegado a las puertas de Santa Fe.',W/2,H/2+18);
  $.fillText('Las Capitulaciones están a salvo.',W/2,H/2+36);
  $.font='13px Arial';
  $.fillStyle='#a0a0b0';
  $.fillText('El 2 de enero de 1492, Granada se rindió.',W/2,H/2+36);
  $.fillText('Colón firmó aquí el viaje que cambiaría el mundo.',W/2,H/2+50);
  $.font='bold 11px Arial';
  $.fillStyle=PAL.gold;
  $.fillText('SCORE: '+String(score).padStart(7,'0'),W/2,H/2+72);
  if(Math.floor(frame/25)%2){
    $.font='13px Arial';
    $.fillStyle='#777';
    $.fillText('PULSA ENTER PARA JUGAR DE NUEVO',W/2,H/2+92);
  }
  $.restore();
  if(keys.enter||keys.fire){
    state='menu';
    currentLevel=1;
    keys.enter=false;
    keys.fire=false;
  }
}

function startGame_(){
  score=0;
  lives=3;
  armorOn=true;
  currentLevel=1;
  isTransitioning=false;
  levelTransitionTimer=0;
  P.x=40;
  P.y=GROUND_Y-40;
  P.vx=0;
  P.vy=0;
  P.dir=1;
  P.onGround=false;
  P.dead=false;
  P.invuln=60;
  P.fireCd=0;
  P.anim=0;
  P.attacking=false;
  P.attackTimer=0;
  P.deathTimer=0;
  camX=0;
  shake=0;
  flashTimer=0;
  frame=0;
  genLevel();
}

buildSprites();
(function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
})();
</script>

<style>

<script>
function checkOrientation(){
  const isMobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(navigator.userAgent);
  const isPortrait = window.innerHeight > window.innerWidth;
  if(isMobile && isPortrait){
    document.body.classList.add('mobile-portrait');
  }else{
    document.body.classList.remove('mobile-portrait');
  }
}

checkOrientation();
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', checkOrientation);

const C=document.getElementById('C'),$=C.getContext('2d');
const W=480,H=270;

const AudioCtx=window.AudioContext||window.webkitAudioContext;
let audioCtx;
function initAudio(){if(!audioCtx)audioCtx=new AudioCtx()}
function snd(freq,dur,type='square',vol=0.05){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,audioCtx.currentTime);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime+dur);
}
function sfxJump(){snd(350,0.12);setTimeout(()=>snd(500,0.08),40)}
function sfxHit(){snd(120,0.25,'sawtooth',0.07)}
function sfxShoot(){snd(700,0.07);setTimeout(()=>snd(550,0.05),25)}
function sfxPickup(){snd(600,0.08);setTimeout(()=>snd(800,0.08),70);setTimeout(()=>snd(1000,0.12),140)}
function sfxDeath(){snd(200,0.35,'sawtooth',0.09);setTimeout(()=>snd(100,0.4,'sawtooth',0.07),180)}
function sfxChest(){snd(400,0.08);setTimeout(()=>snd(600,0.08),90);setTimeout(()=>snd(800,0.12),180)}
function sfxClick(){snd(800,0.04)}

const STORY=[
  {title:'AÑO 1491',subtitle:'La Vega de Granada',text:'Los Reyes Católicos, Isabel y Fernando,\nhan establecido su campamento frente a Granada.\nEl último bastión nazarí resiste.',color:'#ffd700',bg:'#0a0818'},
  {title:'EL INCENDIO',subtitle:'El campamento arde',text:'Un incendio ha arrasado el campamento real.\nPero los Reyes ordenan levantar una nueva ciudad\nde piedra y mortero: SANTA FE.',color:'#ff7043',bg:'#180808'},
  {title:'TU MISIÓN',subtitle:'Caballero de la Reina',text:'Eres un caballero al servicio de Isabel.\nDebes atravesar la Vega, recuperar los pergaminos\nde las Capitulaciones y llegar a Santa Fe.',color:'#66bb6a',bg:'#081808'},
  {title:'¡CUIDADO!',subtitle:'Peligros en el camino',text:'Esqueletos, murciélagos y fantasmas\nacechan en las ruinas del campamento.\n¡Ten cuidado, caballero!',color:'#ef5350',bg:'#180808'},
];

const PAL={
  armor:'#b0c4de',armorLight:'#d4e4f7',armorDark:'#8a9ab0',
  gold:'#ffd700',goldDark:'#cc9900',goldLight:'#ffeb3b',
  skin:'#f5d5b0',skinDark:'#e0b080',
  pink:'#f48fb1',pinkDark:'#c06080',
  grass:'#66bb6a',grassLight:'#81c784',grassDark:'#4caf50',
  dirt:'#8d6e63',dirtDark:'#6d4c41',
  stone:'#9e9e9e',stoneDark:'#757575',stoneLight:'#bdbdbd',
  ghost:'#90caf9',ghostLight:'#bbdefb',
  fire:'#ff7043',fireLight:'#ffab91',
  blood:'#c62828',
};

let state='menu',frame=0,shake=0,flashTimer=0,currentLevel=1,maxLevels=3;
let playerWeapon='lance';
let score=0,lives=3,armorOn=true;
let platforms,enemies,projectiles,particles,pickups,chests,decorations,signs;
let camX=0,storyPage=0,storyTimer=0,menuAnim=0;
let levelTransitionTimer=0;
let isTransitioning=false;
const GRAV=0.32,JUMP=-7.2,SPEED=2.0,FIRE_RATE=20;
const LEVEL_W=4800,GROUND_Y=215;

let damageCooldown=0;
const DAMAGE_COOLDOWN_TIME=60;

let mathQuiz={
  active:false,
  chest:null,
  question:'',
  answer:0,
  usedQuestions:[],
  input:'',
  correct:false,
  showResult:0,
  keyboard:{buttons:[],hoveredBtn:null}
};

const P={x:40,y:GROUND_Y-28,w:16,h:28,vx:0,vy:0,dir:1,onGround:false,
  attacking:false,attackTimer:0,invuln:0,fireCd:0,anim:0,dead:false,deathTimer:0};

const keys={};
document.addEventListener('keydown',e=>{
  initAudio();
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
  if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')keys.up=true;
  if(e.key==='ArrowDown'||e.key==='s')keys.down=true;
  if(e.key==='z'||e.key==='x'||e.key==='j'||e.key==='k')keys.fire=true;
  if(e.key==='Enter')keys.enter=true;
  
  if(mathQuiz.active){
    if(e.key>='0'&&e.key<='9'){
      if(mathQuiz.input.length<3){
        mathQuiz.input+=e.key;
        sfxClick();
      }
      e.preventDefault();
    }
    if(e.key==='Backspace'){
      mathQuiz.input=mathQuiz.input.slice(0,-1);
      sfxClick();
      e.preventDefault();
    }
    if(e.key==='Enter'){
      if(mathQuiz.input.length>0)checkMathAnswer();
      e.preventDefault();
    }
  }
});

document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
  if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')keys.up=false;
  if(e.key==='ArrowDown'||e.key==='s')keys.down=false;
  if(e.key==='z'||e.key==='x'||e.key==='j'||e.key==='k')keys.fire=false;
  if(e.key==='Enter')keys.enter=false;
});

document.querySelectorAll('[data-key]').forEach(btn=>{
  const k=btn.dataset.key;
  const on=()=>{initAudio();keys[k]=true;btn.classList.add('pressed')};
  const off=()=>{keys[k]=false;btn.classList.remove('pressed')};
  btn.addEventListener('touchstart',e=>{e.preventDefault();on()});
  btn.addEventListener('touchend',e=>{e.preventDefault();off()});
  btn.addEventListener('touchcancel',e=>{e.preventDefault();off()});
  btn.addEventListener('mousedown',on);
  btn.addEventListener('mouseup',off);
  btn.addEventListener('mouseleave',off);
});

let mouseX=0,mouseY=0;
C.addEventListener('mousemove',e=>{
  const rect=C.getBoundingClientRect();
  mouseX=(e.clientX-rect.left)*(W/rect.width);
  mouseY=(e.clientY-rect.top)*(H/rect.height);
});
C.addEventListener('click',e=>{
  initAudio();
  if(mathQuiz.active)handleKeyboardClick();
});
C.addEventListener('touchstart',e=>{
  initAudio();
  if(e.touches.length>0){
    const rect=C.getBoundingClientRect();
    mouseX=(e.touches[0].clientX-rect.left)*(W/rect.width);
    mouseY=(e.touches[0].clientY-rect.top)*(H/rect.height);
    if(mathQuiz.active)handleKeyboardClick();
  }
  e.preventDefault();
});

function handleKeyboardClick(){
  for(const btn of mathQuiz.keyboard.buttons){
    if(mouseX>=btn.x&&mouseX<=btn.x+btn.w&&mouseY>=btn.y&&mouseY<=btn.y+btn.h){
      if(btn.value==='check'){
        if(mathQuiz.input.length>0)checkMathAnswer();
      }else if(btn.value==='back'){
        mathQuiz.input=mathQuiz.input.slice(0,-1);
        sfxClick();
      }else{
        if(mathQuiz.input.length<3){
          mathQuiz.input+=btn.value;
          sfxClick();
        }
      }
      break;
    }
  }
}

function generateMathQuestion(){
  const allQuestions=[];
  for(let a=2;a<=9;a++){
    for(let b=2;b<=9;b++){
      allQuestions.push({a:a,b:b,ans:a*b,text:a+' × '+b+' = ?'});
    }
  }
  const available=allQuestions.filter(q=>!mathQuiz.usedQuestions.includes(q.text));
  if(available.length===0){
    mathQuiz.usedQuestions=[];
    return allQuestions[Math.floor(Math.random()*allQuestions.length)];
  }
  const q=available[Math.floor(Math.random()*available.length)];
  mathQuiz.usedQuestions.push(q.text);
  return q;
}

function startMathQuiz(chest){
  mathQuiz.active=true;
  mathQuiz.chest=chest;
  mathQuiz.input='';
  mathQuiz.correct=false;
  mathQuiz.showResult=0;
  const q=generateMathQuestion();
  mathQuiz.question=q.text;
  mathQuiz.answer=q.ans;
  createVirtualKeyboard();
}

function createVirtualKeyboard(){
  mathQuiz.keyboard.buttons=[];
  const btnW=32,btnH=32,gap=6;
  const startX=68,startY=130;
  
  for(let i=0;i<9;i++){
    const row=Math.floor(i/3);
    const col=i%3;
    mathQuiz.keyboard.buttons.push({
      x:startX+col*(btnW+gap),
      y:startY+row*(btnH+gap),
      w:btnW,
      h:btnH,
      value:''+(i+1),
      label:''+(i+1)
    });
  }
  
  mathQuiz.keyboard.buttons.push({
    x:startX,
    y:startY+3*(btnH+gap),
    w:btnW,
    h:btnH,
    value:'0',
    label:'0'
  });
  
  mathQuiz.keyboard.buttons.push({
    x:startX+(btnW+gap),
    y:startY+3*(btnH+gap),
    w:btnW,
    h:btnH,
    value:'back',
    label:'⌫'
  });
  
  mathQuiz.keyboard.buttons.push({
    x:startX+2*(btnW+gap),
    y:startY+3*(btnH+gap),
    w:btnW*2+gap,
    h:btnH,
    value:'check',
    label:'✓'
  });
}

function updateMathQuiz(){
  if(!mathQuiz.active)return;
  mathQuiz.keyboard.hoveredBtn=null;
  for(const btn of mathQuiz.keyboard.buttons){
    if(mouseX>=btn.x&&mouseX<=btn.x+btn.w&&mouseY>=btn.y&&mouseY<=btn.y+btn.h){
      mathQuiz.keyboard.hoveredBtn=btn;
      break;
    }
  }
  if(mathQuiz.showResult>0){
    mathQuiz.showResult--;
    if(mathQuiz.showResult<=0){
      mathQuiz.showResult=0;
      mathQuiz.active=false;
      mathQuiz.chest=null;
      mathQuiz.input='';
    }
  }
}

function checkMathAnswer(){
  if(mathQuiz.input.length===0)return;
  const userAns=parseInt(mathQuiz.input);
  if(userAns===mathQuiz.answer){
    mathQuiz.correct=true;
    mathQuiz.showResult=90;
    sfxChest();
    if(mathQuiz.chest){
      mathQuiz.chest.open=true;
      spawnPk(mathQuiz.chest.x,mathQuiz.chest.y-18,mathQuiz.chest.item);
    }
  }else{
    mathQuiz.correct=false;
    mathQuiz.showResult=60;
    sfxHit();
    mathQuiz.input='';
  }
}

function drawMathQuiz(){
  if(!mathQuiz.active)return;
  
  // Fondo oscuro con blur
  $.fillStyle='rgba(10,10,20,0.95)';
  $.fillRect(0,0,W,H);
  
  const pw=360,ph=220,px=(W-pw)/2,py=(H-ph)/2-5;
  
  // Panel principal con gradiente
  const panelGrad=$.createLinearGradient(px,py,px,py+ph);
  panelGrad.addColorStop(0,'rgba(40,40,60,0.95)');
  panelGrad.addColorStop(1,'rgba(25,25,40,0.95)');
  $.fillStyle=panelGrad;
  $.fillRect(px,py,pw,ph);
  
  // Borde brillante
  $.strokeStyle='#4a90d9';
  $.lineWidth=2;
  $.strokeRect(px,py,pw,ph);
  
  // Título
  $.font='bold 18px "Segoe UI", Arial';
  $.fillStyle='#4a90d9';
  $.textAlign='center';
  $.fillText('🔒 COFRE BLOQUEADO',W/2,py+28);
  
  $.font='13px "Segoe UI", Arial';
  $.fillStyle='#aaa';
  $.fillText('Resuelve la multiplicación para abrirlo:',W/2,py+48);
  
  // Pregunta
  $.font='bold 34px "Segoe UI", Arial';
  $.fillStyle='#fff';
  $.fillText(mathQuiz.question,W/2,py+88);
  
  // Input
  const inputW=140,inputH=40,inputX=(W-inputW)/2,inputY=py+100;
  $.fillStyle='rgba(0,0,0,0.4)';
  $.fillRect(inputX+2,inputY+2,inputW,inputH);
  $.fillStyle='rgba(255,255,255,0.95)';
  $.fillRect(inputX,inputY,inputW,inputH);
  $.strokeStyle='#4a90d9';
  $.lineWidth=2;
  $.strokeRect(inputX,inputY,inputW,inputH);
  
  $.font='bold 28px "Segoe UI", Arial';
  $.fillStyle='#222';
  const displayText=mathQuiz.input+(Math.floor(Date.now()/500)%2==0?'_':'');
  $.fillText(displayText,W/2,inputY+29);

  // Teclado virtual
  for(const btn of mathQuiz.keyboard.buttons){
    const isHovered=mathQuiz.keyboard.hoveredBtn===btn;
    const isCheck=btn.value==='check';
    const isBack=btn.value==='back';
    
    $.fillStyle='rgba(0,0,0,0.3)';
    $.fillRect(btn.x+2,btn.y+2,btn.w,btn.h);
    
    if(isCheck){
      const btnGrad=$.createLinearGradient(btn.x,btn.y,btn.x,btn.y+btn.h);
      btnGrad.addColorStop(0,isHovered?'#4caf50':'#388e3c');
      btnGrad.addColorStop(1,isHovered?'#66bb6a':'#4caf50');
      $.fillStyle=btnGrad;
    }else if(isBack){
      const btnGrad=$.createLinearGradient(btn.x,btn.y,btn.x,btn.y+btn.h);
      btnGrad.addColorStop(0,isHovered?'#ff9800':'#f57c00');
      btnGrad.addColorStop(1,isHovered?'#ffb74d':'#ff9800');
      $.fillStyle=btnGrad;
    }else{
      const btnGrad=$.createLinearGradient(btn.x,btn.y,btn.x,btn.y+btn.h);
      btnGrad.addColorStop(0,isHovered?'#42a5f5':'#1976d2');
      btnGrad.addColorStop(1,isHovered?'#64b5f6':'#42a5f5');
      $.fillStyle=btnGrad;
    }
    
    $.fillRect(btn.x,btn.y,btn.w,btn.h);
    
    $.strokeStyle=isHovered?'#fff':'rgba(255,255,255,0.3)';
    $.lineWidth=1;
    $.strokeRect(btn.x,btn.y,btn.w,btn.h);
    
    $.font=isCheck?'bold 18px "Segoe UI", Arial':'bold 16px "Segoe UI", Arial';
    $.fillStyle='#fff';
    $.textAlign='center';
    $.fillText(btn.label,btn.x+btn.w/2,btn.y+btn.h/2+6);
  }

  $.font='10px "Segoe UI", Arial';
  $.fillStyle='#777';
  $.textAlign='center';
  $.fillText('Usa el teclado virtual o el teclado de tu dispositivo',W/2,py+ph-8);

  // Resultado
  if(mathQuiz.showResult>0){
    $.fillStyle='rgba(0,0,0,0.85)';
    $.fillRect(px+15,py+55,pw-30,115);
    
    $.font='bold 28px "Segoe UI", Arial';
    if(mathQuiz.correct){
      $.fillStyle='#4caf50';
      $.fillText('¡CORRECTO!',W/2,py+105);
      $.font='bold 18px "Segoe UI", Arial';
      $.fillStyle='#81c784';
      $.fillText('✓ Cofre abierto',W/2,py+135);
    }else{
      $.fillStyle='#ef5350';
      $.fillText('✗ INCORRECTO',W/2,py+105);
      $.font='16px "Segoe UI", Arial';
      $.fillStyle='#ef9a9a';
      $.fillText('Intenta de nuevo...',W/2,py+135);
    }
  }
  $.textAlign='left';
}

function startNextLevel(){
  if(isTransitioning)return;
  isTransitioning=true;
  levelTransitionTimer=60;
  flashTimer=30;
  P.x=40;
  P.y=GROUND_Y-40;
  P.vx=0;
  P.vy=0;
  P.dir=1;
}

function completeLevelTransition(){
  isTransitioning=false;
  levelTransitionTimer=0;
  genLevel();
  showLevelMessage();
}

function showLevelMessage(){
  const messages={
    1:'NIVEL 1: LA VEGA DE GRANADA',
    2:'NIVEL 2: CAMINO A SANTA FE', 
    3:'NIVEL 3: EL CASTILLO REAL'
  };
  const msg=messages[currentLevel]||'NIVEL '+currentLevel;
  levelMessageTimer=180;
  currentLevelName=msg;
}

let levelMessageTimer=0;
let currentLevelName='NIVEL 1: LA VEGA DE GRANADA';

function genLevel(){
  platforms=[];enemies=[];projectiles=[];particles=[];pickups=[];chests=[];decorations=[];signs=[];

  const levelConfig={
    1:{
      groundColor:PAL.grass,
      bgGradient:['#0d1b2a','#1b263b','#2d3a4a','#3d4f5f'],
      enemyTypes:['skeleton','bat'],
      enemyCount:25,
      platformHeight:[155,115,75],
      bossType:'wyvern',
      bossX:4200
    },
    2:{
      groundColor:'#d4c4a0',
      bgGradient:['#2d1f16','#4a3428','#6b4a3a','#8a6048'],
      enemyTypes:['skeleton','ghost','bat'],
      enemyCount:20,
      platformHeight:[150,110,70],
      bossType:'boabdil',
      bossX:3500
    },
    3:{
      groundColor:PAL.stone,
      bgGradient:['#1a1a2e','#2d2d44','#40405a','#535370'],
      enemyTypes:['skeleton','ghost','wyvern'],
      enemyCount:25,
      platformHeight:[145,105,65],
      bossType:'boabdil',
      bossX:4000
    }
  };

  const cfg=levelConfig[currentLevel]||levelConfig[1];
  platforms.push({x:0,y:GROUND_Y,w:LEVEL_W,h:60,type:'ground',color:cfg.groundColor});

  const fl=[];
  const platCount=20+currentLevel*5;
  for(let i=0;i<platCount;i++){
    const x=300+i*(LEVEL_W/platCount)+Math.random()*100;
    const hIdx=Math.floor(Math.random()*cfg.platformHeight.length);
    fl.push({x:x,y:cfg.platformHeight[hIdx],w:50+Math.random()*30});
  }
  for(const f of fl)platforms.push({x:f.x,y:f.y,w:f.w,h:11,type:'float'});

  for(let i=0;i<cfg.enemyCount;i++){
    const x=300+i*((LEVEL_W-600)/cfg.enemyCount)+Math.random()*50;
    const typeIdx=Math.floor(Math.random()*cfg.enemyTypes.length);
    const type=cfg.enemyTypes[typeIdx];
    const y=type==='bat'?50+Math.random()*100:GROUND_Y-24;
    enemies.push(mkE(x,y,type));
  }

  if(cfg.bossType==='wyvern'){
    enemies.push(mkE(cfg.bossX,GROUND_Y-28,'wyvern'));
  }else{
    enemies.push(mkE(cfg.bossX,GROUND_Y-48,'boabdil'));
  }

  const chestCount=8+currentLevel*2;
  const items=['coin','heart','armor','axe','fireball'];
  for(let i=0;i<chestCount;i++){
    const x=200+i*((LEVEL_W-400)/chestCount);
    const itemIdx=Math.floor(Math.random()*items.length);
    chests.push({x:x,y:GROUND_Y-14,w:16,h:14,item:items[itemIdx],open:false});
  }

  for(let x=60;x<LEVEL_W;x+=Math.random()*400+300){
    decorations.push({x,y:GROUND_Y-28,type:'tent'});
  }

  showLevelMessage();
}

function mkE(x,y,type){
  const e={x,y,type,vx:0,vy:0,hp:1,dead:false,anim:0,w:16,h:24,dir:-1,
    shootTimer:0,emerging:false,emergeY:0,spawnX:x,spawnY:y,active:false,
    patrolRange:200,retreatTimer:0};
  switch(type){
    case 'skeleton':e.h=24;e.hp=1;e.vx=0.5;e.emerging=true;e.emergeY=y;e.y=y+18;break;
    case 'ghost':e.w=24;e.h=24;e.hp=3;e.patrolRange=180;break;
    case 'bat':e.w=18;e.h=12;e.hp=1;e.vx=-2;break;
    case 'wyvern':e.w=32;e.h=28;e.hp=5;break;
    case 'boabdil':e.w=48;e.h=48;e.hp=20;e.vx=1.2;break;
  }
  return e;
}

function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function update(){
  if(damageCooldown>0)damageCooldown--;

  if(isTransitioning){
    levelTransitionTimer--;
    if(levelTransitionTimer<=0){
      completeLevelTransition();
    }
    frame++;
    return;
  }

  if(state==='story'){
    storyTimer++;
    if((keys.enter||keys.fire)&&storyTimer>20){
      storyPage++;
      storyTimer=0;
      keys.enter=false;
      keys.fire=false;
      if(storyPage>=STORY.length){
        state='playing';
        startGame_();
      }
    }
    return;
  }
  
  if(state!=='playing')return;
  if(mathQuiz.active){
    updateMathQuiz();
    return;
  }
  
  frame++;

  if(!P.dead){
    P.vx=0;
    if(keys.left){P.vx=-SPEED;P.dir=-1;}
    if(keys.right){P.vx=SPEED;P.dir=1;}
    if(keys.up&&P.onGround){
      P.vy=JUMP;
      P.onGround=false;
      sfxJump();
    }
    P.vy+=GRAV;
    if(P.vy>8)P.vy=8;
    P.x+=P.vx;
    for(const p of platforms){
      if(overlap(P,p)){
        if(P.vx>0)P.x=p.x-P.w;
        if(P.vx<0)P.x=p.x+p.w;
      }
    }
    P.y+=P.vy;
    P.onGround=false;
    for(const p of platforms){
      if(overlap(P,p)){
        if(P.vy>0){
          P.y=p.y-P.h;
          P.vy=0;
          P.onGround=true;
        }else if(P.vy<0){
          P.y=p.y+p.h;
          P.vy=0;
        }
      }
    }
    
    if(P.y>H+100||P.y<-100||isNaN(P.x)||isNaN(P.y)){
      P.x=100;
      P.y=GROUND_Y-50;
      P.vx=0;
      P.vy=0;
      camX=0;
    }
    if(P.x<0)P.x=0;
    if(P.x>LEVEL_W-P.w)P.x=LEVEL_W-P.w;
    if(P.y>H+60)pDeath();

    if(keys.fire&&P.fireCd<=0){
      P.attacking=true;
      P.attackTimer=12;
      P.fireCd=FIRE_RATE;
      sfxShoot();
      let projW=16,projH=6,projVx=P.dir*4.5,projVy=0,projLife=80,damage=1;
      if(playerWeapon==='axe'){
        projW=20;
        projH=12;
        projVx=P.dir*6;
        damage=2;
      }
      if(playerWeapon==='fireball'){
        projW=14;
        projH=14;
        projVx=P.dir*5;
        projVy=-1;
        projLife=100;
        damage=3;
      }
      projectiles.push({
        x:P.x+(P.dir>0?P.w:-projW),
        y:P.y+10,
        vx:projVx,
        vy:projVy,
        w:projW,
        h:projH,
        player:true,
        life:projLife,
        damage:damage,
        weapon:playerWeapon
      });
    }
    if(P.fireCd>0)P.fireCd--;
    if(P.attackTimer>0)P.attackTimer--;
    else P.attacking=false;
    if(P.invuln>0)P.invuln--;
    if(Math.abs(P.vx)>0.1)P.anim+=0.18;
    else P.anim=0;

    for(const c of chests){
      if(!c.open&&overlap(P,c)&&!mathQuiz.active){
        startMathQuiz(c);
      }
    }
    
    for(let i=pickups.length-1;i>=0;i--){
      const pk=pickups[i];
      if(overlap(P,pk)){
        sfxPickup();
        if(pk.type==='heart')lives=Math.min(lives+1,5);
        else if(pk.type==='armor'){
          armorOn=true;
          P.invuln=60;
        }
        else if(pk.type==='coin')score+=500;
        else if(pk.type==='scroll')score+=1000;
        else if(pk.type==='axe'){
          playerWeapon='axe';
          score+=200;
          sfxPickup();
        }
        else if(pk.type==='fireball'){
          playerWeapon='fireball';
          score+=300;
          sfxPickup();
        }
        spawnParts(pk.x+6,pk.y+6,8,'#ffd700');
        pickups.splice(i,1);
      }
    }

    for(const s of signs){
      if(Math.abs(P.x-s.x)<60&&!s.shown){
        s.shown=true;
        s.timer=280;
      }
      if(s.timer>0)s.timer--;
    }
  } else {
    P.deathTimer--;
    if(P.deathTimer<=0){
      if(lives<=0)state='gameover';
      else respawn();
    }
  }

  // Proyectiles
  for(let i=projectiles.length-1;i>=0;i--){
    const pr=projectiles[i];
    pr.x+=pr.vx;
    pr.y+=pr.vy;
    pr.life--;
    
    if(pr.life<=0||pr.y>H+20||pr.x<0||pr.x>LEVEL_W){
      projectiles.splice(i,1);
      continue;
    }
    
    if(pr.player){
      let hit=false;
      for(let j=0;j<enemies.length;j++){
        const e=enemies[j];
        if(!e.dead&&e.active&&overlap(pr,e)){
          e.hp-=(pr.damage||1);
          spawnParts(pr.x,pr.y,5,'#ffeb3b');
          hit=true;
          
          if(e.hp<=0){
            e.dead=true;
            if(e.type==='boabdil')score+=5000;
            else if(e.type==='ghost')score+=500;
            else if(e.type==='wyvern')score+=300;
            else score+=100;
            
            spawnParts(e.x+e.w/2,e.y+e.h/2,15,'#ef5350');
            
            if((e.type==='boabdil' || e.type==='wyvern') && currentLevel<maxLevels){
              currentLevel++;
              startNextLevel();
            }else if((e.type==='boabdil' || e.type==='wyvern') && currentLevel>=maxLevels){
              state='victory';
              shake=20;
            }
          }
          break;
        }
      }
      if(hit){
        projectiles.splice(i,1);
        continue;
      }
    }else{
      if(!P.dead&&P.invuln<=0&&overlap(pr,P)){
        pHit();
        projectiles.splice(i,1);
      }
    }
  }

  // Enemigos
  for(const e of enemies){
    if(e.dead)continue;
    if(!e.active&&Math.abs(e.spawnX-P.x)<320)e.active=true;
    if(!e.active)continue;
    e.anim++;

    switch(e.type){
      case 'skeleton':
        if(e.emerging){
          e.y-=0.4;
          if(e.y<=e.emergeY){
            e.y=e.emergeY;
            e.emerging=false;
          }
        }else{
          e.dir=P.x<e.x?-1:1;
          e.x+=e.vx*e.dir;
          e.vy+=GRAV;
          e.y+=e.vy;
          for(const p of platforms){
            if(overlap(e,p)&&e.vy>0){
              e.y=p.y-e.h;
              e.vy=0;
            }
          }
          if(e.y>H+50)e.dead=true;
        }
        break;

      case 'ghost':{
        const dx=P.x-e.x,dy=P.y-e.y,d=Math.sqrt(dx*dx+dy*dy)||1;
        const distFS=Math.abs(e.x-e.spawnX);
        if(distFS>e.patrolRange)e.retreatTimer=80;
        if(e.retreatTimer>0){
          e.retreatTimer--;
          const tx=e.spawnX-e.x,ty=e.spawnY-e.y,td=Math.sqrt(tx*tx+ty*ty)||1;
          e.x+=(tx/td)*1.5;
          e.y+=(ty/td)*1.5;
        }else if(d<220){
          const ang=Math.atan2(dy,dx),wave=Math.sin(e.anim*0.04)*1.5;
          if(e.anim%140<100){
            e.x+=Math.cos(ang)*0.7+Math.cos(e.anim*0.05)*wave;
            e.y+=Math.sin(ang)*0.5+Math.sin(e.anim*0.05)*wave;
          }else{
            e.x+=Math.sin(e.anim*0.1)*0.3;
            e.y+=Math.cos(e.anim*0.1)*0.3;
          }
        }else{
          e.x=e.spawnX+Math.sin(e.anim*0.02)*35;
          e.y=e.spawnY+Math.cos(e.anim*0.03)*15;
        }
        e.dir=dx<0?-1:1;
        if(e.y<25)e.y=25;
        if(e.y>GROUND_Y-e.h)e.y=GROUND_Y-e.h;
        break;
      }

      case 'bat':
        e.x+=e.vx;
        e.y+=Math.sin(e.anim*0.07)*1.2;
        if(e.x<camX-40)e.x=camX+W+20;
        break;

      case 'wyvern':
        e.dir=P.x<e.x?-1:1;
        e.shootTimer++;
        e.y=e.spawnY+Math.sin(e.anim*0.05)*3;
        if(e.shootTimer>180){
          e.shootTimer=0;
          const dx=P.x-e.x,dy=P.y-e.y,d=Math.sqrt(dx*dx+dy*dy)||1;
          if(d<300){
            projectiles.push({
              x:e.x+16,
              y:e.y+14,
              vx:(dx/d)*3,
              vy:(dy/d)*3,
              w:6,
              h:6,
              player:false,
              life:120
            });
          }
        }
        break;

      case 'boabdil':
        e.x+=e.vx;
        if(e.x>4600||e.x<4100)e.vx*=-1;
        e.dir=P.x<e.x?-1:1;
        if(e.anim%150===0)e.vy=-7;
        e.vy+=GRAV;
        e.y+=e.vy;
        for(const p of platforms){
          if(overlap(e,p)&&e.vy>0){
            e.y=p.y-e.h;
            e.vy=0;
          }
        }
        if(e.anim%100===0){
          const dx=P.x-e.x,dy=P.y-e.y,d=Math.sqrt(dx*dx+dy*dy)||1;
          projectiles.push({
            x:e.x+24,
            y:e.y+24,
            vx:(dx/d)*2.2,
            vy:(dy/d)*2.2,
            w:7,
            h:7,
            player:false,
            life:120
          });
        }
        break;
    }
    
    if(!P.dead&&damageCooldown<=0&&!e.dead&&overlap(e,P)){
      pHit();
      damageCooldown=DAMAGE_COOLDOWN_TIME;
    }
  }

  for(const pk of pickups){
    pk.ft=(pk.ft||0)+0.05;
    pk.dy=pk.y+Math.sin(pk.ft)*3;
    pk.life--;
    if(pk.life<=0)pickups.splice(pickups.indexOf(pk),1);
  }
  
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=0.08;
    p.life--;
    if(p.life<=0)particles.splice(i,1);
  }

  const ct=P.x-W/3;
  camX+=(ct-camX)*0.08;
  if(camX<0)camX=0;
  if(camX>LEVEL_W-W)camX=LEVEL_W-W;
  if(shake>0){
    shake*=0.9;
    if(shake<0.5)shake=0;
  }
  if(flashTimer>0)flashTimer--;
  if(levelMessageTimer>0)levelMessageTimer--;
}

function pHit(){
  if(P.invuln>0||P.dead)return;
  sfxHit();
  shake=6;
  flashTimer=5;
  if(armorOn){
    armorOn=false;
    P.invuln=100;
    spawnParts(P.x+8,P.y+14,12,PAL.armor);
  }else pDeath();
}

function pDeath(){
  P.dead=true;
  P.deathTimer=80;
  lives--;
  sfxDeath();
  shake=10;
  spawnParts(P.x+8,P.y+14,20,'#ef5350');
}

function respawn(){
  P.dead=false;
  P.x=Math.max(0,P.x-200);
  P.y=100;
  P.vx=0;
  P.vy=0;
  P.invuln=120;
  armorOn=true;
  damageCooldown=0;
}

function spawnPk(x,y,type){
  pickups.push({
    x,y,dy:y,
    w:type==='coin'?10:12,
    h:type==='scroll'?14:12,
    type,
    life:600,
    ft:0
  });
}

function spawnParts(x,y,n,col){
  for(let i=0;i<n;i++){
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*5,
      vy:(Math.random()-0.5)*5-2,
      life:18+Math.random()*18,
      color:col,
      size:1+Math.random()*2
    });
  }
}

// ============ DIBUJO MODERNO ============

function drawRoundedRect(x,y,w,h,r){
  $.beginPath();
  $.moveTo(x+r,y);
  $.lineTo(x+w-r,y);
  $.quadraticCurveTo(x+w,y,x+w,y+r);
  $.lineTo(x+w,y+h-r);
  $.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  $.lineTo(x+r,y+h);
  $.quadraticCurveTo(x,y+h,x,y+h-r);
  $.lineTo(x,y+r);
  $.quadraticCurveTo(x,y,x+r,y);
  $.closePath();
}

function drawCircle(x,y,r){
  $.beginPath();
  $.arc(x,y,r,0,Math.PI*2);
  $.closePath();
}

function draw(){
  $.fillStyle='#0a0a14';
  $.fillRect(0,0,W,H);
  
  if(state==='menu'){drawMenu();return;}
  if(state==='story'){drawStory();return;}
  if(state==='gameover'){drawGO();return;}
  if(state==='victory'){drawWin();return;}

  const sx=shake?(Math.random()-0.5)*shake:0;
  const sy=shake?(Math.random()-0.5)*shake:0;
  $.save();
  $.translate(sx,sy);
  drawBg();
  $.save();
  $.translate(-Math.floor(camX),0);
  drawPlats();
  drawDeco();
  drawChests();
  drawPks();
  drawProjs();
  drawEns();
  if(!P.dead)drawP();
  drawParts();
  drawCastle();
  $.restore();
  
  if(flashTimer>0){
    $.fillStyle=`rgba(255,255,255,${flashTimer/8})`;
    $.fillRect(0,0,W,H);
  }
  
  if(isTransitioning){
    $.fillStyle='rgba(0,0,0,0.8)';
    $.fillRect(0,0,W,H);
    $.font='bold 22px "Segoe UI", Arial';
    $.fillStyle='#ffd700';
    $.textAlign='center';
    $.fillText('¡NIVEL COMPLETADO!',W/2,H/2);
    $.font='14px "Segoe UI", Arial';
    $.fillStyle='#aaa';
    $.fillText('Cargando siguiente nivel...',W/2,H/2+32);
    $.textAlign='left';
  }
  
  drawHUD();
  drawLore();
  drawMathQuiz();
  $.restore();
}

function drawBg(){
  // Gradiente de cielo
  const g=$.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0d1b2a');
  g.addColorStop(0.4,'#1b263b');
  g.addColorStop(0.7,'#2d3a4a');
  g.addColorStop(1,'#3d4f5f');
  $.fillStyle=g;
  $.fillRect(0,0,W,H);
  
  // Estrellas suaves
  for(let i=0;i<40;i++){
    const sx=((i*137+42)%W+camX*0.01)%W;
    const sy=((i*97+126)%130);
    const b=0.4+((i*73)%100)/100*0.6;
    const tw=Math.sin(frame*0.02+i)*0.2+0.8;
    $.fillStyle=`rgba(255,255,255,${b*tw*0.8})`;
    drawCircle(sx,sy,(i%4===0)?1.5:1);
    $.fill();
  }
  
  // Luna con glow suave
  const mx=W*0.82-camX*0.005,my=35;
  const mg=$.createRadialGradient(mx,my,10,mx,my,50);
  mg.addColorStop(0,'rgba(255,250,220,0.2)');
  mg.addColorStop(1,'rgba(255,250,220,0)');
  $.fillStyle=mg;
  drawCircle(mx,my,50);
  $.fill();
  
  $.fillStyle='#fff8dc';
  drawCircle(mx,my,16);
  $.fill();
  $.fillStyle='#f5f5dc';
  drawCircle(mx-2,my-1,14);
  $.fill();

  // Montañas con parallax
  $.fillStyle='#0f1419';
  for(let i=0;i<12;i++){
    const bx=i*120-(camX*0.03)%120;
    const bh=30+((i*71)%35);
    drawMtn(bx,H-55,120,bh);
  }
  $.fillStyle='#141a22';
  for(let i=0;i<10;i++){
    const bx=i*150-(camX*0.06)%150;
    const bh=22+((i*53)%22);
    drawMtn(bx,H-48,150,bh);
  }
  $.fillStyle='#1a202a';
  for(let i=0;i<8;i++){
    const bx=i*180-(camX*0.12)%180;
    const bh=18+((i*37)%18);
    drawMtn(bx,H-38,180,bh);
  }
  
  // Niebla suave
  const fogGrad=$.createLinearGradient(0,H-80,0,H);
  fogGrad.addColorStop(0,'rgba(20,30,45,0)');
  fogGrad.addColorStop(1,'rgba(20,30,45,0.3)');
  $.fillStyle=fogGrad;
  $.fillRect(0,H-80,W,80);
}

function drawMtn(x,by,w,h){
  $.beginPath();
  $.moveTo(x,by);
  $.lineTo(x+w*0.25,by-h*0.65);
  $.lineTo(x+w*0.5,by-h);
  $.lineTo(x+w*0.75,by-h*0.6);
  $.lineTo(x+w,by);
  $.fill();
}

function drawPlats(){
  for(const p of platforms){
    if(p.x+p.w<camX-20||p.x>camX+W+20)continue;
    if(p.type==='ground'){
      // Tierra con gradiente
      const dirtGrad=$.createLinearGradient(p.x,p.y,p.x,p.y+p.h);
      dirtGrad.addColorStop(0,PAL.dirt);
      dirtGrad.addColorStop(1,PAL.dirtDark);
      $.fillStyle=dirtGrad;
      $.fillRect(p.x,p.y,p.w,p.h);
      
      // Hierba con gradiente
      const grassGrad=$.createLinearGradient(p.x,p.y,p.x,p.y+6);
      grassGrad.addColorStop(0,PAL.grassLight);
      grassGrad.addColorStop(1,PAL.grass);
      $.fillStyle=grassGrad;
      $.fillRect(p.x,p.y,p.w,6);
      
      // Detalles de hierba
      for(let gx=p.x;gx<p.x+p.w;gx+=8){
        const gh=2+((gx*7)%3);
        $.fillStyle=PAL.grassLight;
        $.fillRect(gx,p.y-gh,2,gh);
      }
    }else if(p.type==='float'){
      // Plataforma flotante con bordes redondeados
      const stoneGrad=$.createLinearGradient(p.x,p.y,p.x,p.y+p.h);
      stoneGrad.addColorStop(0,PAL.stoneLight);
      stoneGrad.addColorStop(1,PAL.stoneDark);
      $.fillStyle=stoneGrad;
      drawRoundedRect(p.x,p.y,p.w,p.h,3);
      $.fill();
      
      // Musgo
      $.fillStyle='rgba(76,175,80,0.4)';
      $.fillRect(p.x+3,p.y,4,2);
      $.fillRect(p.x+p.w-8,p.y,5,2);
    }
  }
}

function drawDeco(){
  for(const d of decorations){
    if(d.x<camX-50||d.x>camX+W+50)continue;
    drawTent(d.x,d.y);
  }
}

function drawTent(x,y){
  // Tienda de campaña moderna
  const tentGrad=$.createLinearGradient(x,y+8,x,y+28);
  tentGrad.addColorStop(0,'#c9b896');
  tentGrad.addColorStop(1,'#a08060');
  
  $.fillStyle=tentGrad;
  $.beginPath();
  $.moveTo(x,y+28);
  $.lineTo(x+4,y+8);
  $.lineTo(x+16,y);
  $.lineTo(x+28,y+8);
  $.lineTo(x+32,y+28);
  $.closePath();
  $.fill();
  
  // Interior oscuro
  $.fillStyle='#3d2817';
  $.beginPath();
  $.moveTo(x+12,y+28);
  $.lineTo(x+14,y+14);
  $.lineTo(x+18,y+14);
  $.lineTo(x+20,y+28);
  $.closePath();
  $.fill();
  
  // Bandera
  $.fillStyle='#8b4513';
  $.fillRect(x+15,y-8,2,10);
  $.fillStyle='#c62828';
  $.fillRect(x+17,y-6,8,5);
  $.fillStyle='#ffd700';
  $.fillRect(x+19,y-5,2,2);
}

function drawChests(){
  for(const c of chests){
    if(c.x<camX-30||c.x>camX+W+30)continue;
    
    if(!c.open){
      // Glow dorado suave
      const glowGrad=$.createRadialGradient(c.x+8,c.y+7,2,c.x+8,c.y+7,15);
      glowGrad.addColorStop(0,'rgba(255,215,0,0.3)');
      glowGrad.addColorStop(1,'rgba(255,215,0,0)');
      $.fillStyle=glowGrad;
      drawCircle(c.x+8,c.y+7,15);
      $.fill();
      
      drawChestClosed(c.x,c.y);
    }else{
      drawChestOpen(c.x,c.y);
    }
  }
}

function drawChestClosed(x,y){
  // Base
  const chestGrad=$.createLinearGradient(x,y+4,x,y+14);
  chestGrad.addColorStop(0,'#8b6914');
  chestGrad.addColorStop(1,'#5a4510');
  $.fillStyle=chestGrad;
  drawRoundedRect(x+1,y+4,14,10,2);
  $.fill();
  
  // Tapa
  const lidGrad=$.createLinearGradient(x,y,x,y+5);
  lidGrad.addColorStop(0,'#a08030');
  lidGrad.addColorStop(1,'#6b5010');
  $.fillStyle=lidGrad;
  drawRoundedRect(x,y,16,5,2);
  $.fill();
  
  // Cerradura dorada
  $.fillStyle='#ffd700';
  drawCircle(x+8,y+5,3);
  $.fill();
  $.fillStyle='#b8860b';
  drawCircle(x+8,y+5,2);
  $.fill();
}

function drawChestOpen(x,y){
  // Base
  const chestGrad=$.createLinearGradient(x,y+6,x,y+14);
  chestGrad.addColorStop(0,'#8b6914');
  chestGrad.addColorStop(1,'#5a4510');
  $.fillStyle=chestGrad;
  drawRoundedRect(x+1,y+6,14,8,2);
  $.fill();
  
  // Tapa abierta
  const lidGrad=$.createLinearGradient(x,y-2,x,y+4);
  lidGrad.addColorStop(0,'#a08030');
  lidGrad.addColorStop(1,'#6b5010');
  $.fillStyle=lidGrad;
  $.beginPath();
  $.moveTo(x,y+4);
  $.lineTo(x+2,y-2);
  $.lineTo(x+14,y-2);
  $.lineTo(x+16,y+4);
  $.closePath();
  $.fill();
  
  // Brillo interior
  $.fillStyle='rgba(255,215,0,0.6)';
  $.fillRect(x+4,y+6,8,4);
}

function drawPks(){
  for(const pk of pickups){
    if(pk.x<camX-30||pk.x>camX+W+30)continue;
    const dy=pk.dy||pk.y;
    
    // Glow suave
    const glowGrad=$.createRadialGradient(pk.x+6,dy+6,2,pk.x+6,dy+6,12);
    glowGrad.addColorStop(0,'rgba(255,215,0,0.25)');
    glowGrad.addColorStop(1,'rgba(255,215,0,0)');
    $.fillStyle=glowGrad;
    drawCircle(pk.x+6,dy+6,12);
    $.fill();
    
    switch(pk.type){
      case 'heart':drawHeart(pk.x+2,dy+2,8);break;
      case 'armor':drawArmorPickup(pk.x+3,dy+3);break;
      case 'coin':drawCoin(pk.x+3,dy+2);break;
      case 'scroll':drawScroll(pk.x+4,dy+2);break;
      case 'axe':drawAxePickup(pk.x+2,dy+2);break;
      case 'fireball':drawFireballPickup(pk.x+2,dy+2);break;
    }
  }
}

function drawHeart(x,y,s){
  const heartGrad=$.createLinearGradient(x,y,x,y+s);
  heartGrad.addColorStop(0,'#ff5252');
  heartGrad.addColorStop(1,'#c62828');
  $.fillStyle=heartGrad;
  
  $.beginPath();
  $.moveTo(x+s/2,y+s*0.2);
  $.bezierCurveTo(x,y,x,y+s*0.5,x+s/2,y+s);
  $.bezierCurveTo(x+s,y+s*0.5,x+s,y,x+s/2,y+s*0.2);
  $.fill();
  
  // Brillo
  $.fillStyle='rgba(255,255,255,0.4)';
  drawCircle(x+s*0.3,y+s*0.35,s*0.15);
  $.fill();
}

function drawArmorPickup(x,y){
  const armorGrad=$.createLinearGradient(x,y,x,y+10);
  armorGrad.addColorStop(0,PAL.armorLight);
  armorGrad.addColorStop(1,PAL.armorDark);
  $.fillStyle=armorGrad;
  $.fillRect(x+2,y,6,4);
  $.fillRect(x+1,y+4,8,5);
  $.fillRect(x+3,y+9,4,3);
  
  $.fillStyle='#c62828';
  $.fillRect(x+4,y+5,2,2);
}

function drawCoin(x,y){
  const coinGrad=$.createLinearGradient(x,y,x,y+10);
  coinGrad.addColorStop(0,'#ffd700');
  coinGrad.addColorStop(0.5,'#ffec8b');
  coinGrad.addColorStop(1,'#daa520');
  $.fillStyle=coinGrad;
  drawCircle(x+4,y+5,5);
  $.fill();
  
  $.strokeStyle='#b8860b';
  $.lineWidth=1;
  drawCircle(x+4,y+5,5);
  $.stroke();
  
  $.fillStyle='#b8860b';
  $.font='bold 8px Arial';
  $.textAlign='center';
  $.fillText('$',x+4,y+8);
}

function drawScroll(x,y){
  const scrollGrad=$.createLinearGradient(x,y,x,y+10);
  scrollGrad.addColorStop(0,'#f5deb3');
  scrollGrad.addColorStop(1,'#d2b48c');
  $.fillStyle=scrollGrad;
  $.fillRect(x+1,y+2,6,8);
  
  $.fillStyle='#8b4513';
  $.fillRect(x,y,8,2);
  $.fillRect(x,y+10,8,2);
  
  $.fillStyle='#c62828';
  $.fillRect(x+3,y+7,2,2);
}

function drawAxePickup(x,y){
  $.fillStyle='#8b4513';
  $.fillRect(x+2,y+5,8,2);
  $.fillStyle='#c0c0c0';
  $.fillRect(x+7,y,3,6);
  $.fillStyle='#ff6b6b';
  $.fillRect(x+8,y-1,3,3);
}

function drawFireballPickup(x,y){
  const fireGrad=$.createRadialGradient(x+5,y+5,1,x+5,y+5,5);
  fireGrad.addColorStop(0,'#ffff00');
  fireGrad.addColorStop(0.5,'#ff7043');
  fireGrad.addColorStop(1,'#c62828');
  $.fillStyle=fireGrad;
  drawCircle(x+5,y+5,5);
  $.fill();
}

function drawProjs(){
  for(const pr of projectiles){
    if(pr.player){
      if(pr.weapon==='axe'){
        // Hacha girando
        $.save();
        $.translate(pr.x+10,pr.y+6);
        $.rotate(frame*0.3);
        
        const axeGrad=$.createLinearGradient(-5,-6,5,6);
        axeGrad.addColorStop(0,'#c0c0c0');
        axeGrad.addColorStop(1,'#808080');
        $.fillStyle=axeGrad;
        $.fillRect(-2,-6,4,8);
        
        $.fillStyle='#ff5252';
        $.fillRect(-4,-8,8,4);
        
        $.strokeStyle='rgba(255,100,100,0.5)';
        $.lineWidth=2;
        drawCircle(0,0,10);
        $.stroke();
        
        $.restore();
      }else if(pr.weapon==='fireball'){
        // Bola de fuego
        const fireGrad=$.createRadialGradient(pr.x+7,pr.y+7,2,pr.x+7,pr.y+7,8);
        fireGrad.addColorStop(0,'#ffff00');
        fireGrad.addColorStop(0.4,'#ff7043');
        fireGrad.addColorStop(1,'rgba(198,40,40,0)');
        $.fillStyle=fireGrad;
        drawCircle(pr.x+7,pr.y+7,8);
        $.fill();
        
        // Cola de fuego
        $.fillStyle='rgba(255,112,67,0.4)';
        for(let i=0;i<5;i++){
          drawCircle(pr.x-3-i*2,pr.y+7+Math.sin(frame*0.5+i)*2,3-i*0.4);
          $.fill();
        }
      }else{
        // Lanza
        const lanceGrad=$.createLinearGradient(pr.x,pr.y+3,pr.x+16,pr.y+3);
        lanceGrad.addColorStop(0,'#8b4513');
        lanceGrad.addColorStop(1,'#a0522d');
        $.fillStyle=lanceGrad;
        $.fillRect(pr.x,pr.y+2,10,3);
        
        const tipGrad=$.createLinearGradient(pr.x+10,pr.y,pr.x+16,pr.y+6);
        tipGrad.addColorStop(0,'#e0e0e0');
        tipGrad.addColorStop(1,'#a0a0a0');
        $.fillStyle=tipGrad;
        $.beginPath();
        $.moveTo(pr.x+10,pr.y+1);
        $.lineTo(pr.x+16,pr.y+3.5);
        $.lineTo(pr.x+10,pr.y+6);
        $.closePath();
        $.fill();
      }
    }else{
      // Proyectil enemigo
      const enemyProjGrad=$.createRadialGradient(pr.x+3,pr.y+3,1,pr.x+3,pr.y+3,5);
      enemyProjGrad.addColorStop(0,'#ffeb3b');
      enemyProjGrad.addColorStop(0.5,'#ff5722');
      enemyProjGrad.addColorStop(1,'rgba(198,40,40,0)');
      $.fillStyle=enemyProjGrad;
      drawCircle(pr.x+3,pr.y+3,5);
      $.fill();
    }
  }
}

function drawEns(){
  for(const e of enemies){
    if(e.dead||!e.active||e.x+e.w<camX-40||e.x>camX+W+40)continue;
    
    switch(e.type){
      case 'skeleton':drawSkeleton(e.x,e.y,e.dir,e.anim);break;
      case 'ghost':drawGhost(e.x,e.y,e.dir,e.anim);break;
      case 'bat':drawBat(e.x,e.y,e.anim);break;
      case 'wyvern':drawWyvern(e.x,e.y,e.dir,e.shootTimer,e.hp);break;
      case 'boabdil':drawBoabdil(e.x,e.y,e.dir,e.hp);break;
    }
  }
}

function drawSkeleton(x,y,dir,anim){
  const walkOffset=Math.sin(anim*0.15)*2;
  
  // Aura oscura
  const shadowGrad=$.createRadialGradient(x+8,y+12,5,x+8,y+12,20);
  shadowGrad.addColorStop(0,'rgba(100,100,120,0.2)');
  shadowGrad.addColorStop(1,'rgba(100,100,120,0)');
  $.fillStyle=shadowGrad;
  drawCircle(x+8,y+12,20);
  $.fill();
  
  // Piernas
  $.fillStyle='#d0d0d0';
  $.fillRect(x+4,y+16+walkOffset,3,6);
  $.fillRect(x+9,y+16-walkOffset,3,6);
  
  // Torso
  const boneGrad=$.createLinearGradient(x+4,y+8,x+4,y+16);
  boneGrad.addColorStop(0,'#f0f0f0');
  boneGrad.addColorStop(1,'#c0c0c0');
  $.fillStyle=boneGrad;
  $.fillRect(x+4,y+8,8,8);
  
  // Costillas
  $.fillStyle='#b0b0b0';
  $.fillRect(x+5,y+10,6,1);
  $.fillRect(x+5,y+12,6,1);
  $.fillRect(x+5,y+14,6,1);
  
  // Cabeza
  const skullGrad=$.createLinearGradient(x+5,y,x+5,y+8);
  skullGrad.addColorStop(0,'#f5f5f5');
  skullGrad.addColorStop(1,'#d0d0d0');
  $.fillStyle=skullGrad;
  drawRoundedRect(x+5,y,6,8,2);
  $.fill();
  
  // Ojos rojos brillantes
  $.fillStyle='#ff0000';
  drawCircle(x+6.5,y+3,1.5);
  drawCircle(x+9.5,y+3,1.5);
  $.fill();
  
  // Brillo en ojos
  $.fillStyle='#ff6666';
  drawCircle(x+6.2,y+2.7,0.5);
  drawCircle(x+9.2,y+2.7,0.5);
  $.fill();
  
  // Brazos
  $.fillStyle='#d0d0d0';
  $.fillRect(x+2,y+9,2,5);
  $.fillRect(x+12,y+9,2,5);
}

function drawGhost(x,y,dir,anim){
  const floatY=Math.sin(anim*0.05)*3;
  const gy=y+floatY;
  
  // Aura fantasmal
  const ghostGrad=$.createRadialGradient(x+12,gy+12,5,x+12,gy+12,22);
  ghostGrad.addColorStop(0,'rgba(144,202,249,0.4)');
  ghostGrad.addColorStop(0.5,'rgba(144,202,249,0.2)');
  ghostGrad.addColorStop(1,'rgba(144,202,249,0)');
  $.fillStyle=ghostGrad;
  drawCircle(x+12,gy+12,22);
  $.fill();
  
  // Cuerpo
  const bodyGrad=$.createLinearGradient(x+6,gy,x+6,gy+20);
  bodyGrad.addColorStop(0,'rgba(200,230,255,0.8)');
  bodyGrad.addColorStop(1,'rgba(144,202,249,0.4)');
  $.fillStyle=bodyGrad;
  
  $.beginPath();
  $.moveTo(x+6,gy+20);
  $.lineTo(x+4,gy+15);
  $.lineTo(x+6,gy+10);
  $.lineTo(x+4,gy+5);
  $.lineTo(x+8,gy);
  $.lineTo(x+16,gy);
  $.lineTo(x+20,gy+5);
  $.lineTo(x+18,gy+10);
  $.lineTo(x+20,gy+15);
  $.lineTo(x+18,gy+20);
  $.closePath();
  $.fill();
  
  // Ojos
  $.fillStyle='#1a237e';
  drawCircle(x+9,gy+6,2.5);
  drawCircle(x+15,gy+6,2.5);
  $.fill();
  
  // Boca
  $.fillStyle='#1a237e';
  $.beginPath();
  $.arc(x+12,gy+12,3,0,Math.PI);
  $.fill();
}

function drawBat(x,y,anim){
  const wingY=Math.sin(anim*0.2)*4;
  
  // Cuerpo
  const bodyGrad=$.createLinearGradient(x+9,y+3,x+9,y+9);
  bodyGrad.addColorStop(0,'#5a4a6a');
  bodyGrad.addColorStop(1,'#3a2a4a');
  $.fillStyle=bodyGrad;
  drawEllipse(x+9,y+6,4,5);
  $.fill();
  
  // Alas
  const wingGrad=$.createLinearGradient(x,y+3,x,y+12);
  wingGrad.addColorStop(0,'#6a5a7a');
  wingGrad.addColorStop(1,'#4a3a5a');
  $.fillStyle=wingGrad;
  
  // Ala izquierda
  $.beginPath();
  $.moveTo(x+6,y+5);
  $.lineTo(x,y+3+wingY);
  $.lineTo(x+2,y+8+wingY*0.5);
  $.lineTo(x,y+12);
  $.lineTo(x+6,y+8);
  $.closePath();
  $.fill();
  
  // Ala derecha
  $.beginPath();
  $.moveTo(x+12,y+5);
  $.lineTo(x+18,y+3+wingY);
  $.lineTo(x+16,y+8+wingY*0.5);
  $.lineTo(x+18,y+12);
  $.lineTo(x+12,y+8);
  $.closePath();
  $.fill();
  
  // Ojos
  $.fillStyle='#ff0000';
  drawCircle(x+8,y+4,1);
  drawCircle(x+10,y+4,1);
  $.fill();
  
  // Orejas
  $.fillStyle='#4a3a5a';
  $.beginPath();
  $.moveTo(x+7,y+2);
  $.lineTo(x+6,y-2);
  $.lineTo(x+9,y+1);
  $.closePath();
  $.fill();
  
  $.beginPath();
  $.moveTo(x+11,y+2);
  $.lineTo(x+12,y-2);
  $.lineTo(x+9,y+1);
  $.closePath();
  $.fill();
}

function drawEllipse(x,y,rx,ry){
  $.beginPath();
  $.ellipse(x,y,rx,ry,0,0,Math.PI*2);
  $.closePath();
}

function drawWyvern(x,y,dir,shootTimer,hp){
  // Barra de vida
  const bx=x,by=y-12;
  $.fillStyle='rgba(0,0,0,0.6)';
  $.fillRect(bx,by,32,5);
  $.fillStyle='#300';
  $.fillRect(bx+1,by+1,30,3);
  $.fillStyle='#ff5722';
  $.fillRect(bx+1,by+1,30*(hp/5),3);
  
  // Sombra
  const shadowGrad=$.createRadialGradient(x+16,y+25,5,x+16,y+25,18);
  shadowGrad.addColorStop(0,'rgba(0,0,0,0.3)');
  shadowGrad.addColorStop(1,'rgba(0,0,0,0)');
  $.fillStyle=shadowGrad;
  drawEllipse(x+16,y+25,18,6);
  $.fill();
  
  // Cola
  const tailGrad=$.createLinearGradient(x,y+20,x+10,y+26);
  tailGrad.addColorStop(0,'#2e7d32');
  tailGrad.addColorStop(1,'#1b5e20');
  $.fillStyle=tailGrad;
  $.beginPath();
  $.moveTo(x+4,y+22);
  $.lineTo(x,y+26);
  $.lineTo(x+8,y+28);
  $.lineTo(x+10,y+24);
  $.closePath();
  $.fill();
  
  // Cuerpo
  const bodyGrad=$.createLinearGradient(x+10,y+10,x+10,y+24);
  bodyGrad.addColorStop(0,'#4caf50');
  bodyGrad.addColorStop(1,'#2e7d32');
  $.fillStyle=bodyGrad;
  drawEllipse(x+18,y+18,10,8);
  $.fill();
  
  // Escamas
  $.fillStyle='#66bb6a';
  drawCircle(x+16,y+14,2);
  drawCircle(x+20,y+16,2);
  drawCircle(x+14,y+18,2);
  $.fill();
  
  // Cuello
  const neckGrad=$.createLinearGradient(x+22,y+4,x+22,y+12);
  neckGrad.addColorStop(0,'#66bb6a');
  neckGrad.addColorStop(1,'#4caf50');
  $.fillStyle=neckGrad;
  $.fillRect(x+24,y+4,6,10);
  
  // Cabeza
  const headGrad=$.createLinearGradient(x+26,y,x+26,y+6);
  headGrad.addColorStop(0,'#81c784');
  headGrad.addColorStop(1,'#4caf50');
  $.fillStyle=headGrad;
  drawRoundedRect(x+24,y,10,7,2);
  $.fill();
  
  // Cuernos
  $.fillStyle='#5d4037';
  $.beginPath();
  $.moveTo(x+26,y+1);
  $.lineTo(x+25,y-3);
  $.lineTo(x+28,y+1);
  $.closePath();
  $.fill();
  
  $.beginPath();
  $.moveTo(x+30,y+1);
  $.lineTo(x+32,y-3);
  $.lineTo(x+33,y+1);
  $.closePath();
  $.fill();
  
  // Ojos
  $.fillStyle='#ffeb3b';
  drawCircle(x+28,y+3,2);
  drawCircle(x+32,y+3,2);
  $.fill();
  
  $.fillStyle='#000';
  drawCircle(x+28.5,y+3,1);
  drawCircle(x+32.5,y+3,1);
  $.fill();
  
  // Fuego si está atacando
  if(shootTimer>150){
    const fireGrad=$.createRadialGradient(x+34,y+4,1,x+34,y+4,8);
    fireGrad.addColorStop(0,'#ffff00');
    fireGrad.addColorStop(0.5,'#ff5722');
    fireGrad.addColorStop(1,'rgba(255,87,34,0)');
    $.fillStyle=fireGrad;
    drawCircle(x+34,y+4,8);
    $.fill();
  }
  
  // Alas
  const wingGrad=$.createLinearGradient(x+8,y+8,x+8,y+20);
  wingGrad.addColorStop(0,'#388e3c');
  wingGrad.addColorStop(1,'#1b5e20');
  $.fillStyle=wingGrad;
  
  // Ala izquierda
  $.beginPath();
  $.moveTo(x+14,y+12);
  $.lineTo(x+2,y+6);
  $.lineTo(x+6,y+14);
  $.lineTo(x+2,y+20);
  $.lineTo(x+14,y+16);
  $.closePath();
  $.fill();
  
  // Ala derecha
  $.beginPath();
  $.moveTo(x+22,y+12);
  $.lineTo(x+34,y+6);
  $.lineTo(x+30,y+14);
  $.lineTo(x+34,y+20);
  $.lineTo(x+22,y+16);
  $.closePath();
  $.fill();
  
  // Garras
  $.fillStyle='#424242';
  $.fillRect(x+14,y+24,3,4);
  $.fillRect(x+20,y+24,3,4);
}

function drawBoabdil(x,y,dir,hp){
  // Barra de vida
  const bx=x,by=y-16;
  $.fillStyle='rgba(0,0,0,0.6)';
  $.fillRect(bx-2,by,54,7);
  $.fillStyle='#300';
  $.fillRect(bx,by+1,50,5);
  $.fillStyle='#c62828';
  $.fillRect(bx,by+1,50*(hp/20),5);
  $.fillStyle='#ff5252';
  $.fillRect(bx,by+1,50*(hp/20),2);
  
  $.font='bold 7px "Segoe UI", Arial';
  $.fillStyle='#fff';
  $.textAlign='center';

function drawStory(){
  storyTimer++;
  const pg=STORY[storyPage];
  if(!pg){
    state='playing';
    return;
  }
  
  // Fondo
  const bgGrad=$.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,pg.bg);
  bgGrad.addColorStop(1,'#0a0a14');
  $.fillStyle=bgGrad;
  $.fillRect(0,0,W,H);
  
  // Marco
  $.strokeStyle='rgba(200,160,80,0.2)';
  $.lineWidth=2;
  drawRoundedRect(20,15,W-40,H-30,8);
  $.stroke();
  
  $.save();
  $.textAlign='center';
  $.globalAlpha=Math.min(1,storyTimer/40);
  
  $.font='bold 26px "Segoe UI", Arial';
  const titleGrad=$.createLinearGradient(W/2-60,50,W/2+60,70);
  titleGrad.addColorStop(0,pg.color);
  titleGrad.addColorStop(1,'#fff');
  $.fillStyle=titleGrad;
  $.fillText(pg.title,W/2,68);
  
  if(pg.subtitle){
    $.font='bold 14px "Segoe UI", Arial';
    $.fillStyle='#90caf9';
    $.fillText(pg.subtitle,W/2,88);
  }
  
  $.font='13px "Segoe UI", Arial';
  $.fillStyle='#e0e0e0';
  const lines=pg.text.split('\n');
  for(let i=0;i<lines.length;i++){
    $.fillText(lines[i],W/2,120+i*18);
  }
  
  if(storyTimer>20&&Math.floor(storyTimer/20)%2){
    $.font='12px "Segoe UI", Arial';
    $.fillStyle='#888';
    $.fillText('PULSA ENTER PARA CONTINUAR →',W/2,H-28);
  }
  
  // Indicadores de página
  for(let i=0;i<STORY.length;i++){
    $.fillStyle=i===storyPage?pg.color:'#333';
    drawRoundedRect(W/2-24+i*14,H-16,10,6,2);
    $.fill();
  }
  
  $.restore();
}

  if(Math.floor(frame/25)%2){
    $.fillStyle='#777';
    $.fillText('PULSA ENTER PARA REINTENTAR',W/2,H/2+76);
  }
  
  $.restore();
  
  if(keys.enter||keys.fire){
    state='menu';
    keys.enter=false;
    keys.fire=false;
  }
}

function drawWin(){
  $.fillStyle='rgba(0,0,0,0.88)';
  $.fillRect(0,0,W,H);
  
  $.save();
  $.textAlign='center';
  
  // Partículas de celebración
  for(let i=0;i<12;i++){
    const a=frame*0.02+i*0.52;
    const r=45+Math.sin(frame*0.03+i)*15;
    $.fillStyle=`rgba(255,215,0,${0.25+Math.sin(frame*0.04+i)*0.1})`;
    drawCircle(W/2+Math.cos(a)*r,H/2-25+Math.sin(a)*r*0.4,4);
    $.fill();
  }
  
  $.font='bold 26px "Segoe UI", Arial';
  $.fillStyle='rgba(0,0,0,0.5)';
  $.fillText('¡VICTORIA!',W/2+2,H/2-28);
  
  const winGrad=$.createLinearGradient(W/2-60,H/2-40,W/2+60,H/2-10);
  winGrad.addColorStop(0,'#ffd700');
  winGrad.addColorStop(0.5,'#ffeb3b');
  winGrad.addColorStop(1,'#ffd700');
  $.fillStyle=winGrad;
  $.fillText('¡VICTORIA!',W/2,H/2-30);
  
  $.font='14px "Segoe UI", Arial';
  $.fillStyle='#d0d0e0';
  $.fillText('¡Has completado todos los niveles!',W/2,H/2+5);
  $.fillText('Has llegado a las puertas de Santa Fe.',W/2,H/2+24);
  $.fillText('Las Capitulaciones están a salvo.',W/2,H/2+43);
  
  $.fillStyle='#9090a0';
  $.fillText('El 2 de enero de 1492, Granada se rindió.',W/2,H/2+65);
  $.fillText('Colón firmó aquí el viaje que cambiaría el mundo.',W/2,H/2+82);
  
  $.font='bold 12px "Segoe UI", Arial';
  $.fillStyle='#ffd700';
  $.fillText('SCORE: '+String(score).padStart(7,'0'),W/2,H/2+105);
  
  if(Math.floor(frame/25)%2){
    $.font='14px "Segoe UI", Arial';
    $.fillStyle='#777';
    $.fillText('PULSA ENTER PARA JUGAR DE NUEVO',W/2,H/2+128);
  }
  
  $.restore();
  
  if(keys.enter||keys.fire){
    state='menu';
    currentLevel=1;
    keys.enter=false;
    keys.fire=false;
  }
}

function startGame_(){
  score=0;
  lives=3;
  armorOn=true;
  currentLevel=1;
  isTransitioning=false;
  levelTransitionTimer=0;
  damageCooldown=0;
  P.x=40;
  P.y=GROUND_Y-40;
  P.vx=0;
  P.vy=0;
  P.dir=1;
  P.onGround=false;
  P.dead=false;
  P.invuln=60;
  P.fireCd=0;
  P.anim=0;
  P.attacking=false;
  P.attackTimer=0;
  P.deathTimer=0;
  camX=0;
  shake=0;
  flashTimer=0;
  frame=0;
  genLevel();
}

(function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
